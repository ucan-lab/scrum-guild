# 人が差分を読む領域（docs/development.md の「マージの判定」）。
# label のワークフローは pull_request_target で動き、この規則を PR のベース（main）の版から読む。PR の側で書き換えても判定は変わらない
needs-human:
  - changed-files:
      - any-glob-to-any-file:
          # マイグレーション
          - "migrations/**"
          # seed（公開された開発用のトークンのセッションを入れる）
          - "seed/**"
          # 認証と GitHub OAuth、暗号、シークレット
          - "src/server/auth/**"
          - "src/server/crypto/**"
          - ".dev.vars*"
          # 組織で絞る層（Kysely の2つの入口と batch() の関数）
          - "src/server/db/**"
          # 運用者の権限（運用者だけの操作の定義）
          - "src/shared/operations/operator/**"
          # 権限の検査（操作の定義を登録する関数。各操作の処理は同じ src/server/operations/ に置くので、ファイルで指す）。
          # 権限の種類と実行時の検査（define.ts）、Cookie の名前と属性（session-cookie.ts）、
          # 応答の形とヘッダー（app.ts、errors.ts）、ログの項目（operation-log.ts）も、権限の検査が頼る
          - "src/server/operations/register.ts"
          - "src/server/operations/guards.ts"
          # API トークンで呼べるかの判定（register.ts の範囲の検査と operation-list の絞りが使う）
          - "src/server/operations/token-scope.ts"
          - "src/server/operations/implement.ts"
          - "src/server/operations/operation-log.ts"
          - "src/server/app.ts"
          - "src/server/errors.ts"
          - "src/shared/operations/define.ts"
          - "src/shared/session-cookie.ts"
          # 取り込み元の処理
          - "src/server/import/**"
          # wrangler の設定（見本の Worker の wrangler.design.jsonc も含む）、デプロイのスクリプト、依存
          - "wrangler*.jsonc"
          - "wrangler*.json"
          - "wrangler*.toml"
          - "scripts/**"
          - "**/package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
          - "patches/**"
          - ".npmrc"
          - ".nvmrc"
          - ".node-version"
          # lint の設定（組織で絞る層を守る規則を含む）
          - "eslint.config.*"
          # GitHub と Claude の設定、git のフック
          - ".github/**"
          - ".githooks/**"
          - ".claude/settings.json"
          - ".claude/hooks/**"
          # CI の ai-review が書き込みのトークンを持って読むスキルとエージェント（frontmatter で道具の許可を広げ、フックを走らせられる）
          - ".claude/skills/ai-review/**"
          - ".claude/agents/**"
          - ".mcp.json"
          # Codex のエージェントと設定（sandbox とネットワークを変えられる）、Codex が読む決まりとスキル
          # （入れ子の AGENTS.md と、AGENTS.md より先に読まれる AGENTS.override.md も含む）。
          # macOS の clone は大文字小文字を区別しないので、Claude と Codex の決まりのパスは大文字小文字によらずに拾う
          # （Claude.md が CLAUDE.md に、.Agents/ が .agents/ に入り込む。評価は scripts/labeler.test.ts）
          - "**/.[Cc][Oo][Dd][Ee][Xx]/**"
          - "**/.[Aa][Gg][Ee][Nn][Tt][Ss]/**"
          - "**/[Aa][Gg][Ee][Nn][Tt][Ss].[Mm][Dd]"
          - "**/[Aa][Gg][Ee][Nn][Tt][Ss].[Oo][Vv][Ee][Rr][Rr][Ii][Dd][Ee].[Mm][Dd]"
          # Claude が読む決まり。マージの判定を担うスキルと同じく、セッションが人に聞かずにマージするので人が差分を読む
          - "**/[Cc][Ll][Aa][Uu][Dd][Ee].[Mm][Dd]"
          # マージの判定の本文と、本番に出る利用規約とプライバシーポリシー。.md だけの PR には ai-review が走らず、人が読まなければ誰も確かめない
          - "docs/development.md"
          - "src/lib/legal/**"
  # .claude/ の下のファイル（CI が書き込みのトークンを持って走らせるスクリプトと、スキルとチェックリストの .md も含む。入れ子の .claude/ も）。
  # 評価は scripts/labeler.test.ts で確かめる
  - changed-files:
      - any-glob-to-any-file:
          - "**/.[Cc][Ll][Aa][Uu][Dd][Ee]/**"
