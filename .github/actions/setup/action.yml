name: setup
description: Node を .node-version から、pnpm を package.json の packageManager から入れ、ロックファイルどおりに依存を入れる

runs:
  using: composite
  steps:
    # Node 25 からは corepack が同梱されないので、pnpm は corepack に頼らずに入れる。版を省くと packageManager を読む
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: 版を出す
      shell: bash
      run: |
        echo "node $(node --version)"
        echo "pnpm $(pnpm --version)"

    - name: 依存を入れる
      shell: bash
      run: pnpm install --frozen-lockfile
