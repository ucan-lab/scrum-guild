name: playwright
description: Playwright の chromium を入れる。ブラウザは Playwright の版ごとにキャッシュし、apt での依存の導入（--with-deps）は行わない

# 先に ./.github/actions/setup で依存を入れておく（版は pnpm-lock.yaml の @playwright/test で決まる）。
# キャッシュは PR から main の分を読めるので、main への push で cache.yml が同じ手順を走らせて温める
runs:
  using: composite
  steps:
    - id: version
      name: Playwright の版を読む
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}

    # --with-deps は付けない。apt は Ubuntu のミラーの速さに左右され、2分を超えた実行があった（#250）。
    # ランナーのイメージには chromium の動くライブラリが既にあり、画面の書体は @fontsource から自前で配る。
    # キャッシュに当たれば、ブラウザがあるのを確かめるだけで終わる
    - name: chromium を入れる
      shell: bash
      run: pnpm exec playwright install chromium
