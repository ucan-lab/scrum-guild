name: ci

# PR ごとに回し、結果を ci-ok の1つにまとめる（docs/development.md の「CI」）。
# 各ジョブは package.json のスクリプトを呼ぶだけにし、手順をここに持たない
on:
  pull_request:
    # edited では動かさない。タイトルや本文の編集で何もしない実行ができると、マージの欄では前の実行の結果が隠れるため（#252）。
    # ベースの付け替えは label.yml が拾い、push し直すまで label を失敗にする
    types: [opened, synchronize, reopened]

# label.yml が、どの PR のどのベースで動いた実行かを読む。中身はイベントの時点で決まり、後からベースを変えても変わらない
run-name: "ci pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.ref }}"

# 同じ PR の古い実行は止める
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 文書だけの PR では重いジョブを飛ばす。paths-ignore を使うと ci-ok そのものが出なくなるので、ここで判定する
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      dev_build: ${{ steps.docs.outputs.dev_build }}
      repeat: ${{ steps.repeat.outputs.repeat }}
      repeat_files: ${{ steps.repeat.outputs.repeat_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # --no-renames: リネームを移動先の名前だけで見ると、src/ から docs/ への移動が文書だけに見えるため。
      # -z: 日本語や空白を含む名前を git が引用して書き換えないようにするため
      - id: docs
        name: 文書だけかと、開発モードの e2e を走らせるかを判定する
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/changes.ts | tee -a "$GITHUB_OUTPUT"

      # --diff-filter=AM: 消したテストは回せないので、足したか変えたものだけを渡す。リネームは --no-renames で消すと足すに分かれ、
      # 移動先が足したものとして選ばれる。名前が決まった形に合わなければ scripts/changes.ts が落ちる
      - id: repeat
        name: 繰り返す e2e のテストのファイルを選ぶ
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames --diff-filter=AM -z "$BASE_SHA...$HEAD_SHA" | node scripts/changes.ts --repeat | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      # Claude のフックの判定が壊れたら落とす
      - name: フックのテスト
        run: node --test .claude/hooks/*.test.mjs
      # クラウドのセッションの環境でも、フックのテストの結果が変わらないことを確かめる
      - name: フックのテスト（CLAUDE_CODE_REMOTE=true）
        run: node --test .claude/hooks/*.test.mjs
        env:
          CLAUDE_CODE_REMOTE: 'true'

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 1つが落ちても残りを走らせ、落ちたテストを一度に見られるようにする
      fail-fast: false
      # vitest のファイルを2つのランナーに分ける。1つのランナーでは、ファイルごとの起動の重さと並びの上限（4 コア）で
      # e2e の最長より長くなるため（#653）。数を変えるときは、この配列と docs/development.md の「CI」の test の行も直す
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:vitest --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # test から node --test の側（scripts/ と cli/lib/）を分けて並べ、PR の待ちを e2e の最長より短くする
  test-node:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # scripts/acceptance-video.test.ts が、判定の HTML を chromium で動かす。無いとそのテストがスキップされる
      - uses: ./.github/actions/playwright
      - run: pnpm test:node

  migration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:fresh

  # CI の長さを決めるジョブなので、ファイル単位のシャードに分けて並べる。シャードごとにランナーと手元の D1 が別になる。
  # Playwright の --shard は件数で割って所要時間を見ないので、ファイルごとの重み（秒）で割る（scripts/e2e-shard.ts。#601）。
  # ci-ok の needs では、マトリクスのジョブは1つの結果にまとまる（1つでも落ちれば failure）
  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 1つが落ちても残りを走らせ、落ちたテストを一度に見られるようにする
      fail-fast: false
      # シャードの数は strategy.job-total で scripts/e2e-shard.ts に渡して追従する。数を変えるときは、この配列と、
      # docs/development.md の「CI」の e2e の行（シャードの数と成果物の名前）も直す
      matrix:
        shard: [1, 2, 3]
    env:
      # 画面と /api/health に同じ版が出ることも確かめる
      APP_VERSION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      # 割り当ては scripts/e2e-shard.ts（ファイルごとの重みで割る）。FILES=$(...) の失敗（不正な引数、空のシャード）は -e で止める。
      # 空のまま pnpm e2e に渡すと Playwright が全件を走らせるので、スクリプトが空なら非 0 で落とす
      - run: |
          FILES=$(node scripts/e2e-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }})
          pnpm e2e $FILES
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}
          # 落ちたジョブを再実行すると同じ名前で上げ直すため
          overwrite: true
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # 開発モードの build（NODE_ENV=development）で e2e を流し、Svelte と SvelteKit の開発時の警告が出たテストを落とす（#375。e2e/fixtures.ts）。
  # 本番の build では警告が出ないので、上の e2e では拾えない。画面のコード、依存、e2e と build の仕組みが変わった PR だけ走らせる
  # （scripts/ci.ts の needsDevBuild）。走らないときは ci-ok が skipped を期待する
  e2e-dev:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.dev_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # e2e と同じ割り方（scripts/e2e-shard.ts）。数を変えるときは docs/development.md の「CI」の e2e-dev の行も直す
      matrix:
        shard: [1, 2, 3]
    env:
      APP_VERSION: ${{ github.event.pull_request.head.sha }}
      E2E_DEV_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      # 割り当ては scripts/e2e-shard.ts（ファイルごとの重みで割る）。FILES=$(...) の失敗（不正な引数、空のシャード）は -e で止める。
      # 空のまま pnpm e2e に渡すと Playwright が全件を走らせるので、スクリプトが空なら非 0 で落とす
      - run: |
          FILES=$(node scripts/e2e-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }})
          pnpm e2e $FILES
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dev-${{ matrix.shard }}
          overwrite: true
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # PR で足したか変えた e2e のテストのファイルだけを、1つのワーカーで5回ずつ繰り返し、揺れるテストを main に入る前に落とす（#451）。
  # 並べたまま繰り返すと負荷だけで落ち（#364）、同じテストの複製が共有の D1 で自分とぶつかるので --workers=1 にする。
  # 繰り返しの間に seed は入れ直さない（docs/development.md の「e2e の書き方」の、繰り返しに耐える決まり）。
  # 件数の合計が上限（scripts/ci.ts の REPEAT_TEST_LIMIT）を超えたら、回さずに成功で終えて注記を出す。
  # 走らないときは ci-ok が skipped を期待する
  e2e-repeat:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.repeat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 数を変えるときは docs/development.md の「CI」の e2e-repeat の行も直す
      matrix:
        shard: [1, 2, 3]
    env:
      APP_VERSION: ${{ github.event.pull_request.head.sha }}
      # changes が名前の形（空白もシェルの記号も含まない）を確かめた、空白区切りの一覧。引用せずに語に分けて渡す
      REPEAT_FILES: ${{ needs.changes.outputs.repeat_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # --list はサーバーを立てず、global-setup も動かさない。件数はシャードと繰り返しを付けずに数え、どのシャードでも同じ答えにする
      - id: count
        name: 繰り返すテストの件数を上限と比べる
        run: |
          set -o pipefail
          pnpm exec playwright test --list --reporter=json $REPEAT_FILES | node scripts/e2e-repeat-count.ts $REPEAT_FILES | tee -a "$GITHUB_OUTPUT"

      - if: steps.count.outputs.run == 'true'
        uses: ./.github/actions/playwright
      # ファイルが少ないとテストの無いシャードができるので、--pass-with-no-tests を付ける
      - if: steps.count.outputs.run == 'true'
        run: >-
          pnpm e2e --workers=1 --repeat-each=5 --retries=0 --pass-with-no-tests
          --shard=${{ matrix.shard }}/${{ strategy.job-total }} $REPEAT_FILES
      - if: ${{ !cancelled() && steps.count.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-repeat-${{ matrix.shard }}
          overwrite: true
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # マージの前に確かめるのはこれと label（ai-review は助言なので含めない）。
  # 文書だけなら重いジョブは飛んでいてよく、そうでなければすべて成功していなければならない。
  # 取り消された実行でも always() で動かして failure を残す。!cancelled() にすると ci-ok が skipped になり、
  # 同じ head の結果がマージの欄で skipped しか出ず、成功していないことが読み取りにくくなるため
  ci-ok:
    needs: [changes, check, test, test-node, migration, e2e, e2e-dev, e2e-repeat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 判定は scripts/ci.ts の ciOkVerdict（node --test にかける）。needs を丸ごと渡すので、
      # 重いジョブを足すときは上の needs に入れるだけでよい
      - name: 結果をまとめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ok.ts
