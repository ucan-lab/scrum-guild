name: ci

# PR ごとに回し、結果を ci-ok の1つにまとめる（docs/development.md の「CI」）。
# 各ジョブは package.json のスクリプトを呼ぶだけにし、手順をここに持たない
on:
  pull_request:
    # edited では動かさない。タイトルや本文の編集で何もしない実行ができると、マージの欄では前の実行の結果が隠れるため（#252）。
    # ベースの付け替えは label.yml が拾い、push し直すまで label を失敗にする
    types: [opened, synchronize, reopened]

# label.yml が、どの PR のどのベースで動いた実行かを読む。中身はイベントの時点で決まり、後からベースを変えても変わらない
run-name: "ci pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.ref }}"

# 同じ PR の古い実行は止める
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 文書だけの PR では重いジョブを飛ばす。paths-ignore を使うと ci-ok そのものが出なくなるので、ここで判定する
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # --no-renames: リネームを移動先の名前だけで見ると、src/ から docs/ への移動が文書だけに見えるため。
      # -z: 日本語や空白を含む名前を git が引用して書き換えないようにするため
      - id: docs
        name: 文書だけかを判定する
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/docs-only.ts | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      # Claude のフックの判定が壊れたら落とす
      - name: フックのテスト
        run: node --test .claude/hooks/*.test.mjs
      # クラウドのセッションの環境でも、フックのテストの結果が変わらないことを確かめる
      - name: フックのテスト（CLAUDE_CODE_REMOTE=true）
        run: node --test .claude/hooks/*.test.mjs
        env:
          CLAUDE_CODE_REMOTE: 'true'

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  migration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:fresh

  # CI の長さを決めるジョブなので、ファイル単位のシャードに分けて並べる。シャードごとにランナーと手元の D1 が別になる。
  # ci-ok の needs では、マトリクスのジョブは1つの結果にまとまる（1つでも落ちれば failure）
  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 1つが落ちても残りを走らせ、落ちたテストを一度に見られるようにする
      fail-fast: false
      # --shard の分母は strategy.job-total で追従する。数を変えるときは docs/development.md の「CI」の e2e の行（/3 と成果物の名前）も直す
      matrix:
        shard: [1, 2, 3]
    env:
      # 画面と /api/health に同じ版が出ることも確かめる
      APP_VERSION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}
          # 落ちたジョブを再実行すると同じ名前で上げ直すため
          overwrite: true
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # マージの前に確かめるのはこれと label（ai-review は助言なので含めない）。
  # 文書だけなら重いジョブは飛んでいてよく、そうでなければすべて成功していなければならない。
  # 取り消された実行でも always() で動かして failure を残す。!cancelled() にすると ci-ok が skipped になり、
  # 同じ head の結果がマージの欄で skipped しか出ず、成功していないことが読み取りにくくなるため
  ci-ok:
    needs: [changes, check, test, migration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 判定は scripts/ci.ts の ciOkVerdict（node --test にかける）。needs を丸ごと渡すので、
      # 重いジョブを足すときは上の needs に入れるだけでよい
      - name: 結果をまとめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ok.ts
