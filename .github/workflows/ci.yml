name: ci

# PR ごとに回し、結果を ci-ok の1つにまとめる（docs/development.md の「CI」）。
# 各ジョブは package.json のスクリプトを呼ぶだけにし、手順をここに持たない
on:
  pull_request:
    # edited では動かさない。タイトルや本文の編集で何もしない実行ができると、マージの欄では前の実行の結果が隠れるため（#252）。
    # ベースの付け替えは label.yml が拾い、push し直すまで label を失敗にする
    types: [opened, synchronize, reopened]

# label.yml が、どの PR のどのベースで動いた実行かを読む。中身はイベントの時点で決まり、後からベースを変えても変わらない
run-name: "ci pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.ref }}"

# 同じ PR の古い実行は止める
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 文書だけの PR では重いジョブを飛ばす。paths-ignore を使うと ci-ok そのものが出なくなるので、ここで判定する
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # --no-renames: リネームを移動先の名前だけで見ると、src/ から docs/ への移動が文書だけに見えるため。
      # -z: 日本語や空白を含む名前を git が引用して書き換えないようにするため
      - id: docs
        name: 文書だけかを判定する
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | node scripts/docs-only.ts | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      # Claude のフックの判定が壊れたら落とす
      - name: フックのテスト
        run: node --test .claude/hooks/*.test.mjs
      # クラウドのセッションの環境でも、フックのテストの結果が変わらないことを確かめる
      - name: フックのテスト（CLAUDE_CODE_REMOTE=true）
        run: node --test .claude/hooks/*.test.mjs
        env:
          CLAUDE_CODE_REMOTE: 'true'

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  migration:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:fresh

  # CI の長さを決めるジョブなので、ファイル単位のシャードに分けて並べる。シャードごとにランナーと手元の D1 が別になる。
  # ci-ok の needs では、マトリクスのジョブは1つの結果にまとまる（1つでも落ちれば failure）
  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 1つが落ちても残りを走らせ、落ちたテストを一度に見られるようにする
      fail-fast: false
      # --shard の分母は strategy.job-total で追従する。数を変えるときは docs/development.md の「CI」の e2e の行（/3 と成果物の名前）も直す
      matrix:
        shard: [1, 2, 3]
    env:
      # 画面と /api/health に同じ版が出ることも確かめる
      APP_VERSION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}
          # 落ちたジョブを再実行すると同じ名前で上げ直すため
          overwrite: true
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # e2e のスクリーンショットのうち、ベースの main と違う画面だけを画像用の R2 のバケットに上げ、変更前と変更後を並べた
  # コメントを PR に1つ付けて、push のたびに書き換える（docs/development.md の「CI」）。
  # 見た目を確かめる助けで、マージの判定には入れない（ci-ok の needs に入れない。落ちても ci-ok は落ちず、このジョブの分の待ちも伸びない）。
  # fork と Bot（Dependabot など）の PR にはシークレットと書き込みのトークンが渡らないので動かさない
  evidence:
    needs: [changes, e2e]
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # 比べる処理（scripts/evidence*.ts）は PR の head の版を使う。ci.yml も PR の head の版が動くので、
      # PR の head のコードは PR 用の鍵を取れる（段ごとに env を分けるのは見せない工夫で、境界ではない）。
      # main の変更前の画像と一覧は、鍵を Environment の evidence-main に置いた別のバケットにあり、PR からは書けない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # scripts/evidence*.ts は Node の標準の部品だけを使うので、依存は入れない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 人がバケットとシークレットを用意する前でも CI を赤くしないよう、どれかが無ければ注記を出して後の段を飛ばす。
      # PR 用の鍵と変数に、変更前の画像を読む main 用の公開の URL を足して見る。シークレットは値でなく有無だけを渡す
      - id: config
        name: 上げる先の設定を確かめる
        env:
          EVIDENCE_PR_R2_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_PR_R2_ACCESS_KEY_ID != '' }}
          EVIDENCE_PR_R2_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_PR_R2_SECRET_ACCESS_KEY != '' }}
          EVIDENCE_R2_ENDPOINT: ${{ vars.EVIDENCE_R2_ENDPOINT }}
          EVIDENCE_PR_BUCKET: ${{ vars.EVIDENCE_PR_BUCKET }}
          EVIDENCE_PR_PUBLIC_URL: ${{ vars.EVIDENCE_PR_PUBLIC_URL }}
          EVIDENCE_MAIN_PUBLIC_URL: ${{ vars.EVIDENCE_MAIN_PUBLIC_URL }}
        run: node scripts/evidence-config.ts pr

      - if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e

      # ベースの一覧（main/<ベースの SHA>.json）は main 用の公開の URL から読む。無ければ main/latest.json と比べ、そのことをコメントに書く。
      # 読めなければ（404 のほかの失敗）、ジョブを落とさずに注記を出し、比べられなかったとコメントに書く。
      # e2e は PR の head をベースにマージした状態（refs/pull/<番号>/merge）を撮る。BASE_SHA はイベントの時点のベースなので、
      # 落ちたジョブだけを再実行しても、その後に進んだ main とは比べない
      - id: compare
        if: steps.config.outputs.ready == 'true'
        name: ベースの画像と比べる
        env:
          RESULTS_DIR: ${{ runner.temp }}/e2e
          OUT_DIR: ${{ runner.temp }}/evidence
          EVIDENCE_MAIN_PUBLIC_URL: ${{ vars.EVIDENCE_MAIN_PUBLIC_URL }}
          EVIDENCE_PR_PUBLIC_URL: ${{ vars.EVIDENCE_PR_PUBLIC_URL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/evidence-pr.ts

      # PR にしか無い画像を、ランナーの AWS CLI で PR 用のバケット（R2 の S3 互換の API）に送る。
      # R2 は AWS CLI の既定のチェックサムの付け方を受け付けないので、要るときだけにする。
      # 画像は中身のハッシュを名前にするので、同じ名前は同じ中身で、長くキャッシュしてよい。
      # 送る先の名前が決まった形（scripts/evidence.ts の UPLOAD_KEY。PR 用は img/<ハッシュ>.png）でなければ送らずに止める
      - if: steps.config.outputs.ready == 'true'
        name: 画像を R2 に上げる
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_PR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_PR_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ vars.EVIDENCE_R2_ENDPOINT }}
          BUCKET: ${{ vars.EVIDENCE_PR_BUCKET }}
          UPLOADS: ${{ runner.temp }}/evidence/uploads.tsv
        # エンドポイントは https://<アカウント ID>.r2.cloudflarestorage.com。末尾に / があっても動くよう外す
        run: |
          ENDPOINT=${ENDPOINT%/}
          while IFS=$'\t' read -r file key; do
            if [[ ! "$key" =~ ^img/[0-9a-f]{64}\.png$ ]]; then
              echo "送る先の名前の形が違う: $key" >&2
              exit 1
            fi
            aws s3 cp "$file" "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" \
              --content-type image/png --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          done < "$UPLOADS"

      # 目印（scripts/evidence.ts の COMMENT_MARKER と同じ文字列）を含む github-actions[bot] のコメントを探して書き換える。
      # 無ければ、変わった画面、新しい画面、無くなった画面のどれかがあるか、比べられなかったときだけ付ける
      # （scripts/evidence.ts の shouldPost。画面を変えない PR にはコメントを付けない）
      - if: steps.config.outputs.ready == 'true'
        name: PR のコメントを書き換える
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          POST: ${{ steps.compare.outputs.post }}
          BODY: ${{ runner.temp }}/evidence/comment.md
        run: |
          ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- e2e-evidence -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$BODY" > /dev/null
            echo "コメント $id を書き換えた"
          elif [ "$POST" = 'true' ]; then
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$BODY" > /dev/null
            echo "コメントを付けた"
          else
            echo "変わった画面が無いので、コメントを付けない"
          fi

  # マージの前に確かめるのはこれと label（ai-review は助言なので含めない）。
  # 文書だけなら重いジョブは飛んでいてよく、そうでなければすべて成功していなければならない。
  # 取り消された実行でも always() で動かして failure を残す。!cancelled() にすると ci-ok が skipped になり、
  # 同じ head の結果がマージの欄で skipped しか出ず、成功していないことが読み取りにくくなるため
  ci-ok:
    needs: [changes, check, test, migration, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # 判定は scripts/ci.ts の ciOkVerdict（node --test にかける）。needs を丸ごと渡すので、
      # 重いジョブを足すときは上の needs に入れるだけでよい
      - name: 結果をまとめる
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ok.ts
