name: ready

# 着手できる Issue に status:ready を付け、当てはまらなくなったら外す（docs/development.md の「Issue の状態」）。
# ラベルは人が画面の一覧で見るための写しで、着手できるかの判定には使わない。
# sprint-pick と increment-build は依存関係の API で毎回判定する（ラベルは次の実行まで古いことがあるため）
on:
  # 開いている Issue の数え直しの種。どのきっかけでも、イベントの Issue ではなく開いている Issue をすべて数え直す。
  # 前に要るものが閉じたり受け入れ待ちになったりすると、待つ側の状態も変わり、イベントの Issue だけでは直せないため
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  # GITHUB_TOKEN が付けた status:accepting では issues のイベントが来ない。accepting.yml の完了で拾う
  workflow_run:
    workflows: [accepting]
    types: [completed]
  # 依存関係（blocked by）とサブ Issue の付け外しでは Actions のイベントが来ないので、定期に拾う。
  # 分は 0 以外の半端な値にする（毎時 0 分は混み合い、定期の実行が遅れたり落ちたりするため）。
  # 公開リポジトリでは、60日動きが無いと止まる。止まったら workflow_dispatch で動かし直す
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# 同時の実行は並べる。毎回すべてを数え直すので、待ちの実行が新しいものに置き換わっても失うものが無い
concurrency:
  group: ready
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ready:
    # 1回の実行で API を数十回呼び、GITHUB_TOKEN の上限（1時間 1,000 回）はリポジトリのワークフローで共有する。
    # 誰でも自分の Issue を開閉できるので、開閉で動かすのは作者が身内の Issue だけにし、上限を使い切らせない。
    # 外の人の Issue の変化は schedule が拾う。ラベルの付け外しは、判定に効くラベルのときだけ動かす。
    # Issue のテンプレート（story.md）が付けるラベルでも labeled が来るので、作者を問わず開くたびに動かさないため。
    # accepting の完了は、マージで付け替えた実行（成功）だけを拾う。fork の PR を閉じただけの skipped の完了では動かさない
    if: >-
      (github.event_name != 'issues'
        || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
          && (startsWith(github.event.label.name, 'pt:')
            || startsWith(github.event.label.name, 'status:')
            || github.event.label.name == 'epic'
            || github.event.label.name == 'sprint-log'))
        || (github.event.action != 'labeled'
          && github.event.action != 'unlabeled'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)))
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request_target'
          && github.event.workflow_run.path == '.github/workflows/accepting.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # checkout してよい。workflow_dispatch 以外のきっかけは既定のブランチの版で動き、PR のコードを取り込まない
      # （accepting.yml が checkout を置かないのは pull_request_target のためで、PR のコードが書き込みの権限で動いてしまう）。
      # workflow_dispatch は選んだブランチの版で動くが、動かせるのは書き込みの権限を持つ人だけ。
      # 公開リポジトリで誰でも Issue を書けるので、イベントの中身（題、本文、番号）は読まず、run にも渡さない（job の if で作者の区分を見るだけ）。
      # 依存のパッケージは使わないので、pnpm install は置かない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # github.token で付け外しするので、この実行が起こす issues のイベントは新しい実行にならない
      - name: status:ready を付け外しする
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ready.ts
