name: evidence-review

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request:
    types: [ready_for_review, labeled]

jobs:
  decide:
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run の pull_requests は空のことがあり、PR の番号はジョブの前に決まらない。
    # 同じリポジトリの head のブランチは PR と1対1なので、両方のイベントにあるブランチ名で PR ごとにそろえる
    concurrency:
      group: evidence-review-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.prepare.outputs.run || 'false' }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      # workflow_run から来ても、PR のコードを実行せず、判定の処理は main の版だけを使う
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # workflow_run に PR が無い場合だけ、同じ head の開いた PR を後の Node の段で選ぶ
      - name: PR の候補を取る
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RAW_DIR: ${{ runner.temp }}/evidence-raw
        run: |
          set -euo pipefail
          mkdir -p "$RAW_DIR"
          echo '[]' > "$RAW_DIR/candidates.json"
          if [ "$EVENT_NAME" = workflow_run ] && [ -z "$EVENT_PR" ]; then
            gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/pulls" > "$RAW_DIR/candidates.json"
          fi
      - id: pr
        name: PR の番号を決める
        run: node scripts/evidence-review-decide.ts resolve "$RUNNER_TEMP/evidence-raw"

      - name: PR と ci の実行を取る
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAW_DIR: ${{ runner.temp }}/evidence-raw
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RAW_DIR/pr.json"
          echo '[]' > "$RAW_DIR/runs.json"
          if [ "$EVENT_NAME" = pull_request ]; then
            gh api --paginate --slurp "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request" > "$RAW_DIR/runs.json"
          fi
      - id: ci
        name: 比べる ci の実行を決める
        if: steps.pr.outputs.pr_number != ''
        run: node scripts/evidence-review-decide.ts ci "$RUNNER_TEMP/evidence-raw"

      - name: ci のジョブと既存のコメントを取る
        if: steps.ci.outputs.ci_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
          RAW_DIR: ${{ runner.temp }}/evidence-raw
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/actions/runs/$CI_RUN_ID/jobs" > "$RAW_DIR/jobs.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$RAW_DIR/comments.json"
      - id: gate
        name: 画像を比べる条件を確かめる
        if: steps.ci.outputs.ci_run_id != ''
        env:
          EVIDENCE_MAIN_PUBLIC_URL: ${{ vars.EVIDENCE_MAIN_PUBLIC_URL }}
        run: node scripts/evidence-review-decide.ts decide "$RUNNER_TEMP/evidence-raw"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          pattern: e2e-[0-9]*
          run-id: ${{ steps.ci.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/e2e
      - id: prepare
        name: 変更前後の画像を並べる
        if: steps.gate.outputs.run == 'true'
        env:
          RESULTS_DIR: ${{ runner.temp }}/e2e
          OUT_DIR: ${{ runner.temp }}/evidence-ctx
          EVIDENCE_MAIN_PUBLIC_URL: ${{ vars.EVIDENCE_MAIN_PUBLIC_URL }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: node scripts/evidence-review-prepare.ts

      # ai-review と同じく、本文とコメントは補助の情報。取得できなくても画像と差分は渡す。
      # 絞る前の JSON は材料の外に置き、整えた後に消す
      - name: PR の本文とコメントを取る
        if: steps.prepare.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RAW_DIR: ${{ runner.temp }}/pr-raw
        run: |
          set -euo pipefail
          mkdir -p "$RAW_DIR"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RAW_DIR/pr.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$RAW_DIR/issue-comments.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments" > "$RAW_DIR/review-comments.json"
      - name: PR の本文とコメントを整える
        if: steps.prepare.outputs.run == 'true'
        continue-on-error: true
        env:
          RAW_DIR: ${{ runner.temp }}/pr-raw
          CONTEXT_DIR: ${{ runner.temp }}/evidence-ctx
        run: |
          set -euo pipefail
          trap 'rm -rf "$RAW_DIR"' EXIT
          mkdir -p "$CONTEXT_DIR"
          node scripts/ai-review-context.ts "$RAW_DIR" "$CONTEXT_DIR"

      # 公開リポジトリなので fetch に認証は要らない。head は参照だけ取り、作業コピーには展開しない。
      # 待つ間に push された場合でも、比較した SHA の差分だけを渡す
      - name: 差分を書き出す
        if: steps.prepare.outputs.run == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          CONTEXT_DIR: ${{ runner.temp }}/evidence-ctx
        run: |
          set -euo pipefail
          git fetch origin "pull/$PR_NUMBER/head"
          git diff "$BASE_SHA...$HEAD_SHA" > "$CONTEXT_DIR/diff.patch"
          git -c core.quotePath=false diff --name-status "$BASE_SHA...$HEAD_SHA" > "$CONTEXT_DIR/files.txt"
          echo "変わったファイル: $(wc -l < "$CONTEXT_DIR/files.txt") 件"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.run == 'true'
        with:
          name: evidence-ctx
          path: ${{ runner.temp }}/evidence-ctx/
          retention-days: 1
