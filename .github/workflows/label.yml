name: label

# 人が差分を読む領域に触れた PR に needs-human を付ける（docs/development.md の「マージの判定」）。
# pull_request_target なので、このワークフローも .github/labeler.yml も PR のベース（main）の版で動き、PR の側で書き換えても逃れられない
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, unlabeled]

jobs:
  label:
    # edited はベースを付け替えたときだけ動かす（別のブランチをベースに開いてから main へ付け替えて逃れる経路を塞ぐ）。
    # unlabeled は人が needs-human を外したときだけ動かし、パスに当たっていれば付け直す
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'needs-human')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout を置かない。pull_request_target のトークンは書き込めるので、PR のコードを取り込むと
      # そのコードが書き込みの権限で動く。labeler は手元に規則が無ければ、API でベースの版を読む
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # 付けるだけで外さない。外すのは人
          sync-labels: false

      # labeler は移動先のパスしか見ないので、守るパスの外へのリネームを拾えない。
      # 変更ファイルの一覧は 3000 件までしか返らない。どちらも規則で判定できないので、当たれば needs-human を付ける
      - name: リネームと大きな PR に needs-human を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          renamed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | select(.status == "renamed") | .filename' | wc -l)
          echo "renamed=$renamed changed_files=$CHANGED_FILES"
          if [ "$renamed" -gt 0 ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f 'labels[]=needs-human' --silent
          fi
