name: label

# 人が差分を読む領域に触れた PR に needs-human を付ける（docs/development.md の「マージの判定」）。
# pull_request_target なので、このワークフローも .github/labeler.yml も PR のベース（main）の版で動き、PR の側で書き換えても逃れられない
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, unlabeled]

# どのイベントでも、イベントの中身ではなく、そのときの PR の状態から判定する（#252）。
# - ジョブを飛ばさない。飛ばした実行（skipped）が同じ head に後からできると、マージの欄では前の実行の結果が隠れる
# - concurrency を置かない。同じグループの待ちの実行は新しい実行に置き換えられて取り消され、ベースを付け替えた実行が消えうる
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # PR の履歴（timeline）と ci.yml の実行を読む
      issues: read
      actions: read
    steps:
      # actions/checkout を置かない。pull_request_target のトークンは書き込めるので、PR のコードを取り込むと
      # そのコードが書き込みの権限で動く。labeler は手元に規則が無ければ、API でベースの版を読む。
      # どのイベントでも付け直す（付けるだけなので何度走っても同じ）。別のブランチをベースに開いてから main へ付け替えて逃れる経路と、
      # 人が needs-human を外した後も、パスに当たっていれば付け直す
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # 付けるだけで外さない。外すのは人
          sync-labels: false

      # labeler は移動先のパスしか見ないので、守るパスの外へのリネームを拾えない。
      # 変更ファイルの一覧は 3000 件までしか返らない。どちらも規則で判定できないので、当たれば needs-human を付ける
      - name: リネームと大きな PR に needs-human を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          renamed=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | select(.status == "renamed") | .filename' | wc -l)
          echo "renamed=$renamed changed_files=$CHANGED_FILES"
          if [ "$renamed" -gt 0 ] || [ "$CHANGED_FILES" -gt 3000 ]; then
            gh api "repos/$REPO/issues/$PR_NUMBER/labels" -f 'labels[]=needs-human' --silent
          fi

      # ci.yml は edited で動かないので、ベースを付け替えても ci-ok は前のベースの結果のまま残る。
      # PR の履歴の最後の付け替えより後に、この head で ci.yml が動いていなければ失敗にする（push か再開で動き直す）。
      # 読めなければ失敗に倒す。前のステップが落ちても動かす
      - name: ベースの付け替えの後に CI が動き直したかを確かめる
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # 人の付け替えと、重ねた PR の下がマージされたときの GitHub の自動の付け替えの両方を拾う
          changed=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/timeline?per_page=100" \
            --jq '.[] | select(.event == "base_ref_changed" or .event == "automatic_base_change_succeeded") | .created_at' |
            sort | tail -n 1)
          if [ -z "$changed" ]; then
            echo "ベースの付け替えは無い"
            exit 0
          fi
          # 今のベースは、イベントの中身でなく API で読む（イベントは前後しうる）
          base=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref)
          echo "最後のベースの付け替え: $changed、今のベース: $base"
          for attempt in 1 2 3 4 5 6; do
            # 数えるのは、この PR の今のベースで動いた実行（ci.yml の run-name）だけ。付け替えの直前のイベントで作られた実行は前のベースを、
            # 同じ head の別の PR の実行は別の PR を名に持つので数えない。承認待ちで走っていない実行も数えない
            # ブランチ名を jq の式に埋めず、--arg で渡す
            latest=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" |
              jq -r --arg title "ci pr=$PR_NUMBER base=$base" \
                '[.workflow_runs[] | select(.display_title == $title and .status != "waiting" and .status != "action_required" and .conclusion != "action_required") | .created_at] | max // ""')
            echo "この head の ci.yml の最後の実行: ${latest:-無し}"
            # 時刻は同じ形の UTC の ISO 8601 なので、文字列で比べられる
            if [[ "$latest" > "$changed" ]]; then
              exit 0
            fi
            # push と再開の直後は、同じイベントで始まる ci.yml の実行がまだ見えないことがあるので待つ
            if [ "$ACTION" != synchronize ] && [ "$ACTION" != reopened ]; then
              break
            fi
            sleep 10
          done
          echo "::error::ベースを付け替えたあと、この head で CI が動き直していません。新しいベースを取り込んで push してください"
          exit 1
