name: ai-review

# サブスクの使用量は手元の対話の利用と共有なので、push ごとには回さない。
# もう一度見せたいときは、人が PR に ai-review のラベルを付ける。
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  review:
    # action は .claude/ を base のブランチから戻すので、レビュー済みの main を base にした PR だけで動かす
    # fork と Bot（Dependabot など）の PR にはシークレットが渡らないので回さない
    # 書き込みの権限の無い人も、このリポジトリの既存のブランチから PR を開ける。シークレット付きで本文を読ませないよう、作成者の区分でも絞る。
    # MEMBER は組織に入っていることしか表さず、書き込みの権限を保証しないので入れない
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      # Claude が動かすコマンドの環境から、OAuth トークンなどの秘密情報を除く
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # サブエージェントを裏で起動すると、報告を待たずにセッションが終わる。前景で動かす
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # 秘密情報を除く設定は bubblewrap を要る。action が自分で入れるのは allowed_non_write_users を設定したときだけなので、ここで入れる
      - name: bubblewrap を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # .ts を直に動かすには、ランナーの既定より新しい Node が要る
      # 本文とコメントは補助の情報なので、次の2段が落ちても差分だけで AI レビューを続ける
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: true
        with:
          node-version-file: .node-version

      # Claude には gh api を許さないので、PR の本文とコメントはここで取り、ファイルで渡す。
      # 絞る前の JSON は、Claude に渡す pr-context とは別の pr-raw に置く（誰でも書けるコメントを読ませない）。
      # --slurp はページごとの配列を1つの配列にまとめる（整形の段が平らにならす）
      - name: PR の本文とコメントを取る
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RAW_DIR: ${{ runner.temp }}/pr-raw
        run: |
          set -euo pipefail
          mkdir -p "$RAW_DIR"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RAW_DIR/pr.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$RAW_DIR/issue-comments.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments" > "$RAW_DIR/review-comments.json"

      # 権限の無い人のコメントを落とし、大きさを抑える。ログには件数だけを出す。
      # 整形が落ちても、絞る前の JSON は消す。
      # pr-context は Claude の --add-dir に渡すので、整形が落ちても空で作っておく
      - name: PR の本文とコメントを整える
        continue-on-error: true
        env:
          RAW_DIR: ${{ runner.temp }}/pr-raw
          CONTEXT_DIR: ${{ runner.temp }}/pr-context
        run: |
          set -euo pipefail
          trap 'rm -rf "$RAW_DIR"' EXIT
          mkdir -p "$CONTEXT_DIR"
          node scripts/ai-review-context.ts "$RAW_DIR" "$CONTEXT_DIR"

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub App のトークンは contents: write を持ち、上の permissions に縛られない。
          # ワークフローのトークンを渡し、PR へのコメントまでに抑える
          github_token: ${{ github.token }}
          # 分類は ANTHROPIC_API_KEY が無いと動かない。選別は ai-review のスキルで行う
          classify_inline_comments: "false"
          prompt: "/ai-review REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }} BASE_SHA: ${{ github.event.pull_request.base.sha }} HEAD_SHA: ${{ github.event.pull_request.head.sha }} CONTEXT_DIR: ${{ runner.temp }}/pr-context"
          # prompt を渡す agent モードでは、action は許可するツールを足さない。サブエージェントが使う Bash もここに書く。
          # gh api は任意の API と外部の URL を叩けるので許可しない。gh pr comment はこの PR に --body でだけ書ける
          # gh pr view と gh pr diff は許可しない。前者は --comments で pr-context で落とした権限の無い人のコメントを、
          # 後者は別の PR の番号や外のホストの URL で信用しない差分を読めてしまうため。差分は git diff で読む
          # pr-context はチェックアウトの外（runner.temp）にあるので、読める場所として足す
          claude_args: |
            --model sonnet
            --add-dir "${{ runner.temp }}/pr-context"
            --allowedTools "Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --body:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(ls:*),Bash(echo:*)"

      - name: ai-review のラベルを外す
        if: always() && github.event.action == 'labeled'
        # 人が先に外していると 404 になる。レビューの結果とは関係ないので失敗にしない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/ai-review"
