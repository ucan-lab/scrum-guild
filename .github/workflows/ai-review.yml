name: ai-review

# サブスクの使用量は手元の対話の利用と共有なので、push ごとには回さない。
# もう一度見せたいときは、人が PR に ai-review のラベルを付ける。
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  review:
    # action は .claude/ を base のブランチから戻すので、レビュー済みの main を base にした PR だけで動かす
    # fork と Bot（Dependabot など）の PR にはシークレットが渡らないので回さない
    # 書き込みの権限の無い人も、このリポジトリの既存のブランチから PR を開ける。シークレット付きで本文を読ませないよう、作成者の区分でも絞る。
    # MEMBER は組織に入っていることしか表さず、書き込みの権限を保証しないので入れない
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      # Claude が動かすコマンドの環境から、OAuth トークンなどの秘密情報を除く
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      # サブエージェントを裏で起動すると、報告を待たずにセッションが終わる。前景で動かす
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # 秘密情報を除く設定は bubblewrap を要る。action が自分で入れるのは allowed_non_write_users を設定したときだけなので、ここで入れる
      - name: bubblewrap を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # .ts を直に動かすには、ランナーの既定より新しい Node が要る
      # 本文とコメントは補助の情報なので、次の2段が落ちても差分だけで AI レビューを続ける
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        continue-on-error: true
        with:
          node-version-file: .node-version

      # Claude には gh api を許さないので、PR の本文とコメントはここで取り、ファイルで渡す。
      # 絞る前の JSON は、Claude に渡す pr-context とは別の pr-raw に置く（誰でも書けるコメントを読ませない）。
      # --slurp はページごとの配列を1つの配列にまとめる（整形の段が平らにならす）
      - name: PR の本文とコメントを取る
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RAW_DIR: ${{ runner.temp }}/pr-raw
        run: |
          set -euo pipefail
          mkdir -p "$RAW_DIR"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RAW_DIR/pr.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$RAW_DIR/issue-comments.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments" > "$RAW_DIR/review-comments.json"

      # done-check と前の AI レビューの印から、今回見る範囲の起点を決める。印が読めないときは全体に倒す。
      - name: 起点を決める
        id: scope
        continue-on-error: true
        env:
          RAW_DIR: ${{ runner.temp }}/pr-raw
          CONTEXT_DIR: ${{ runner.temp }}/pr-context
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          NO_DIFF_BODY_FILE: ${{ runner.temp }}/pr-no-diff-body.md
        run: node scripts/ai-review-scope.ts

      # 権限の無い人のコメントを落とし、大きさを抑える。ログには件数だけを出す。
      # 整形が落ちても、絞る前の JSON は消す。
      # pr-context は Claude の --add-dir に渡すので、整形が落ちても空で作っておく
      - name: PR の本文とコメントを整える
        continue-on-error: true
        env:
          RAW_DIR: ${{ runner.temp }}/pr-raw
          CONTEXT_DIR: ${{ runner.temp }}/pr-context
        run: |
          set -euo pipefail
          trap 'rm -rf "$RAW_DIR"' EXIT
          mkdir -p "$CONTEXT_DIR"
          node scripts/ai-review-context.ts "$RAW_DIR" "$CONTEXT_DIR"

      # Claude には Bash を許さないので、差分はここで書き出して pr-context で渡す。
      # 差分の無いレビューは意味が無いので、上の2段と違い、落ちたらジョブを落とす。
      # まとめの置き場の pr-out も、Claude の --add-dir に渡すのでここで空で作る
      - name: 差分を書き出す
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTEXT_DIR: ${{ runner.temp }}/pr-context
          OUT_DIR: ${{ runner.temp }}/pr-out
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          SCOPE_MODE: ${{ steps.scope.outputs.mode }}
          SCOPE_START: ${{ steps.scope.outputs.start }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR" "$OUT_DIR"
          if [ "$SCOPE_OUTCOME" = success ] && [ -f "$CONTEXT_DIR/diff.patch" ] && [ -f "$CONTEXT_DIR/files.txt" ] && [ -f "$CONTEXT_DIR/scope.md" ]; then
            printf 'mode=%s\nstart=%s\n' "$SCOPE_MODE" "$SCOPE_START" >> "$GITHUB_OUTPUT"
          else
            git diff "$BASE_SHA...$HEAD_SHA" > "$CONTEXT_DIR/diff.patch"
            # Claude はパスをそのまま Read に渡すので、日本語のパスをクォートさせない
            git -c core.quotePath=false diff --name-status "$BASE_SHA...$HEAD_SHA" > "$CONTEXT_DIR/files.txt"
            printf '%s\n' '## AI レビューの範囲' '' '- 方式: 全体（起点の判定が落ちたため）' > "$CONTEXT_DIR/scope.md"
            printf 'mode=full\nstart=\n' >> "$GITHUB_OUTPUT"
          fi
          echo "変わったファイル: $(wc -l < "$CONTEXT_DIR/files.txt") 件"

      # 起点から差分が無いイベントでは、Claude を動かさず決まった文だけを付ける。
      - name: 差分が無い旨を PR に付ける
        if: steps.diff.outputs.mode == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NO_DIFF_BODY_FILE: ${{ runner.temp }}/pr-no-diff-body.md
        run: gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$NO_DIFF_BODY_FILE"

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        id: claude
        if: steps.diff.outputs.mode != 'none'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub App のトークンは contents: write を持ち、上の permissions に縛られない。
          # ワークフローのトークンを渡し、PR へのコメントまでに抑える
          github_token: ${{ github.token }}
          # 分類は ANTHROPIC_API_KEY が無いと動かない。選別は ai-review のスキルで行う
          classify_inline_comments: "false"
          prompt: "/ai-review REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }} BASE_SHA: ${{ github.event.pull_request.base.sha }} HEAD_SHA: ${{ github.event.pull_request.head.sha }} CONTEXT_DIR: ${{ runner.temp }}/pr-context WORKSPACE: ${{ github.workspace }} OUT_FILE: ${{ runner.temp }}/pr-out/summary.md"
          # prompt を渡す agent モードでは、action は許可するツールを足さない。許可はサブエージェントにも効く。
          # Bash は一切許さない。前方一致の許可は後ろの引数を縛らず、gh pr comment -R で外へ送る、git diff --output= でランナーの
          # ファイルに書く、といった抜け道が1つずつ残るため。差分は前の段が、PR へのまとめは後の段が受け持つ。
          # --tools で組み込みの道具そのものを絞る。RemoteTrigger、EnterWorktree、CronCreate などは --allowedTools に無くても
          # 確認なしに走り、RemoteTrigger はトークンの持ち主のアカウントで routine を作れるため。MCP の道具は --tools に左右されない。
          # 書けるのは summary.md の1ファイルだけ（Edit の許可は Write にも効く）。// で始まる綴りは絶対パス。
          # チェックアウトの .git/config には action がトークン入りの origin の URL を書くので、Read、Grep、Glob から読ませない。
          # base の .claude/settings.json は mcp__github__ の道具を許すので、github の MCP が入っても使えないよう断る
          # pr-context と pr-out はチェックアウトの外（runner.temp）にあるので、触れる場所として足す
          claude_args: |
            --model sonnet
            --add-dir "${{ runner.temp }}/pr-context"
            --add-dir "${{ runner.temp }}/pr-out"
            --tools "Read,Grep,Glob,Edit,Write,Agent"
            --allowedTools "Task,Agent,mcp__github_inline_comment__create_inline_comment,Edit(/${{ runner.temp }}/pr-out/summary.md)"
            --disallowedTools "Bash,mcp__github__*,Read(/${{ github.workspace }}/.git/**)"

      # Claude にはコメントを書く道具を許さないので、まとめはここでこの PR の番号に固定して1件付ける。
      # Claude が書かずに終わったか、action が落ちたときも、その旨を1件付ける
      - name: まとめを PR に付ける
        if: ${{ !cancelled() && steps.diff.outputs.mode != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUT_FILE: ${{ runner.temp }}/pr-out/summary.md
          BODY_FILE: ${{ runner.temp }}/pr-summary-body.md
          MARK_SHA: ${{ steps.claude.outcome == 'success' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          node scripts/ai-review-summary.ts "$OUT_FILE" "$BODY_FILE" "$MARK_SHA"
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$BODY_FILE"

      - name: ai-review のラベルを外す
        if: always() && github.event.action == 'labeled'
        # 人が先に外していると 404 になる。レビューの結果とは関係ないので失敗にしない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/ai-review"
