name: ai-review

# サブスクの使用量は手元の対話の利用と共有なので、push ごとには回さない。
# もう一度見せたいときは、人が PR に ai-review のラベルを付ける。
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 分類は ANTHROPIC_API_KEY が無いと動かない。選別は ai-review のスキルで行う
          classify_inline_comments: "false"
          prompt: "/ai-review REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }} BASE_SHA: ${{ github.event.pull_request.base.sha }} HEAD_SHA: ${{ github.event.pull_request.head.sha }}"
          # prompt を渡す agent モードでは、action は許可するツールを足さない。サブエージェントが使う Bash もここに書く
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(ls:*),Bash(echo:*)"

      - name: ai-review のラベルを外す
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ai-review"
