name: ai-review

# サブスクの使用量は手元の対話の利用と共有なので、push ごとには回さない。
# もう一度見せたいときは、人が PR に ai-review のラベルを付ける。
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  review:
    # action は .claude/ を base のブランチから戻すので、レビュー済みの main を base にした PR だけで動かす
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      # Claude が動かすコマンドの環境から、OAuth トークンなどの秘密情報を除く
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub App のトークンは contents: write を持ち、上の permissions に縛られない。
          # ワークフローのトークンを渡し、PR へのコメントまでに抑える
          github_token: ${{ github.token }}
          # 分類は ANTHROPIC_API_KEY が無いと動かない。選別は ai-review のスキルで行う
          classify_inline_comments: "false"
          prompt: "/ai-review REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }} BASE_SHA: ${{ github.event.pull_request.base.sha }} HEAD_SHA: ${{ github.event.pull_request.head.sha }}"
          # prompt を渡す agent モードでは、action は許可するツールを足さない。サブエージェントが使う Bash もここに書く。
          # gh api は任意の API と外部の URL を叩けるので許可しない
          claude_args: |
            --model sonnet
            --allowedTools "Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(ls:*),Bash(echo:*)"

      - name: ai-review のラベルを外す
        if: always() && github.event.action == 'labeled'
        # 人が先に外していると 404 になる。レビューの結果とは関係ないので失敗にしない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/ai-review"
