<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 組織の選択</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="gate"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";

// 組織の選択: 入れる組織が2つ以上の人に、ログインの直後に出す。メニューの組織の切り替えからも来る
const { D, t, icon, esc, emblem } = SQ;
function render() {
  document.getElementById("gate").innerHTML = `<div class="gate"><div class="gate-stack">
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="brand-name">Scrum Guild</span></div>
      <h1 class="gate-title">${t("organization")}を選ぶ</h1>
      <p>入れる${t("organization")}が ${D.organizations.length} つあります。名前、レベル、経験値、稼働の設定は${t("organization")}ごとに別です。</p>
      <div class="choice-list">
        ${D.organizations.map((k) => `<a class="choice" href="today.html">
          <div><b>${esc(k.name)}</b><span class="mono">scrum-guild.dev/${esc(k.slug)}/</span><span>${t("workspace")} ${k.wss}・最後に入った日 ${esc(k.lastSeen)}</span></div>
          ${k.admin ? `<span class="chip">${t("admin")}</span>` : ""}${emblem(k.level, true)}</a>`).join("")}
      </div>
      <p class="gate-note">あとから、メニューの上の${t("organization")}の切り替えで選び直せます。</p>
      <div class="form-actions"><button class="btn is-primary" type="button" data-toast="組織作成のダイアログを開きます">組織を作る</button></div>
      <div class="form-actions"><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">届いた招待</h2>
      <div class="choice-list">
      ${[...new Set(D.receivedInvites.map((i) => i.organization))].map((name) => `<a class="choice" href="login.html"><div>
        <b>${esc(name)}</b>
        <span>承諾待ちの招待があります</span></div>
      </a>`).join("")}
      </div>
      <p class="gate-note">すべての${t("organization")}に届いた招待を、${t("organization")}ごとに1件にまとめて出します。押すと、その${t("organization")}の招待の画面（見本は login.html の「届いた招待」）で承諾か辞退を選べます。</p>
    </section>
    <p class="gate-note" style="text-align:center"><a href="index.html">デザインシステムのカタログへ戻る</a></p>
  </div></div>`;
}
SQ.applyTheme();
render();

</script>
</body>
</html>
