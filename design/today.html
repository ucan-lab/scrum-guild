<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日やること - Scrum Guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// 今日やること: 所属するすべてのワークスペースから、自分が担当するタスクを並べる
const { D, t, book, section, foldedSection, pageHead, sprintNotice, levelPanel, load } = SQ;

SQ.mount("today", () => {
  const mine = SQ.tasksWhere((x) => x.who === D.me);
  const open = mine.filter((x) => !x.doneAt);
  const inWeek = (x) => { const d = SQ.dueOf(x); return d && d.date >= D.today && d.date <= D.weekEnd; };
  const carryDays = (x) => x.todayOn && x.todayOn < D.today ? Math.max(1, Math.round((new Date(`${D.today}T00:00:00Z`) - new Date(`${x.todayOn}T00:00:00Z`)) / 86400000)) : 0;
  const todayList = open.filter((x) => x.todayOn).sort((a, b) => carryDays(b) - carryDays(a));
  const dueList = open.filter((x) => !x.todayOn && inWeek(x));
  const restList = open.filter((x) => !x.todayOn && !inWeek(x) && x.sprint && D.sprints[x.sprint].status === "active");
  const doneList = mine.filter((x) => x.doneAt && x.doneAt.startsWith("10/20"));
  const overdue = open.filter((x) => { const d = SQ.dueOf(x); return d && d.date < D.today; }).length;
  const thisWeek = open.filter((x) => { const d = SQ.dueOf(x); return d && d.date >= D.today && d.date <= D.weekEnd; }).length;
  const opts = { showWs: true, meta: (x) => carryDays(x) ? `<span class="props-note">${carryDays(x)} 日前から</span>` : "" };
  const hasWs = Object.keys(D.workspaces).length > 0;
  const active = Object.keys(D.sprints).filter((id) => D.sprints[id].status === "active");
  const todayEmpty = hasWs
    ? SQ.emptyState("sun", `今日やる${t("task")}はまだありません`,
        `${t("backlog")}や${t("sprint")}の行の左端にある太陽を押すと、ここに並びます。`,
        `<a class="btn is-sm" href="${SQ.firstHref("backlog.html")}">${t("backlog")}を開く</a>`, undefined, "notice")
    : SQ.emptyState("sun", `今日やる${t("task")}はまだありません`, `${t("workspace")}に所属すると、自分が担当する${t("task")}がここに並びます。`, "", undefined, "notice");
  // 今日やる以外の区分は、空なら出さない
  const part = (id, title, list) => (list.length ? section(id, title, list.length, book(list, opts)) : "");
  const dueOpts = { ...opts, meta: (x) => `${x.due === D.today ? '<span class="chip is-warn">今日</span>' : ''}${opts.meta(x)}` };
  const capacityPanel = SQ.first
    ? `<section class="panel"><div class="panel-title"><b>${t("capacity")}</b></div>
        <p class="panel-note">${hasWs ? "" : `${t("workspace")}に所属して、`}${t("sprint")}に担当の${t("task")}が入ると、作業量と基準がここに並びます。</p></section>`
    : `<section class="panel">
        <div class="panel-title"><b>${t("capacity")}</b>今の${t("sprint")}</div>
        ${load(D.workspaces.wa.name, "配分 60%", 45.6, 56.0)}
        ${load(D.workspaces.wb.name, "配分 40%", 30.4, 12.0, { none: 1 })}
        ${load("10月の合計", "ユーザーの基準", 172.0, 168.0)}
        <p class="panel-note">休み <span class="mono">10/23</span> 半日</p>
      </section>`;
  return `<div class="layout-aside">
    <div class="layout-main">
      ${pageHead(D.todayLabel, "今日やること", [
        ["", "sun", "今日やると決めたもの", todayList.length],
        ["is-danger", "alert", `${t("due")}切れ`, overdue],
        ["is-warn", "clock", `今週が${t("due")}`, thisWeek],
        ["is-ok", "check", "取り込み元で完了", open.filter((x) => x.srcDone).length],
        ["", "check", t("doneToday"), doneList.length],
      ])}
      ${SQ.first ? SQ.firstSteps(SQ.first) : ""}
      ${active.length ? `<div class="notice-grid">${active.map((id) => sprintNotice(id)).join("")}</div>` : ""}
      ${part("s-overdue", `${t("due")}切れ`, open.filter((x) => { const d = SQ.dueOf(x); return d && d.date < D.today; }))}
      ${section("s-today", "今日やると決めたもの", todayList.length, book(todayList, { ...opts, empty: todayEmpty }), "印を付けた日が過ぎても、完了にするか印を外すまで残ります")}
      ${dueList.length ? section("s-due", `今週が${t("due")}`, dueList.length, book(dueList, dueOpts)) : ""}
      ${restList.length ? foldedSection("s-sprint", `進行中の${t("sprint")}`, restList.length, book(restList, opts)) : ""}
      ${part("s-done", t("doneToday"), doneList)}
    </div>
    <aside class="layout-side" aria-label="自分の記録">
      ${levelPanel()}
      ${capacityPanel}
    </aside>
  </div>`;
});
</script>
</body>
</html>
