<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild デザインシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* カタログ自身の配置だけ。部品の見た目は components.css から来る */
.cat { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-8); max-width: 1240px; margin: 0 auto;
  padding-block: var(--space-6) var(--space-10);
  padding-left: max(var(--space-6), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-6), env(safe-area-inset-right, 0px)); }
.cat-toc { position: sticky; top: var(--space-4); align-self: start; display: grid; gap: 2px; font-size: var(--text-sm); }
.cat-toc a { color: var(--color-muted); text-decoration: none; padding: 3px var(--space-2); border-radius: var(--radius-1); }
.cat-toc a:hover { color: var(--color-fg); background: var(--color-rule); }
.cat-main { display: grid; gap: var(--space-10); min-width: 0; }
.cat-head { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: end; justify-content: space-between; }
.cat-lead { color: var(--color-muted); max-width: 64ch; }
.cat-block { display: grid; gap: var(--space-4); scroll-margin-top: var(--space-4); }
.cat-block > p { color: var(--color-muted); max-width: 66ch; font-size: var(--text-sm); }
.cat-demo { background: var(--color-bg); border: 1px dashed var(--color-line); border-radius: var(--radius-1); padding: var(--space-5); display: grid; gap: var(--space-4); min-width: 0; }
.cat-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.cat-name { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted); }
.cat-rules { margin: 0; padding-left: 1.2em; font-size: var(--text-sm); display: grid; gap: 4px; max-width: 70ch; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }
.swatch { display: grid; gap: 4px; font-size: var(--text-xs); min-width: 0; }
.swatch i { display: block; height: 44px; border: 1px solid var(--color-line); border-radius: var(--radius-1); }
.swatch b { font-weight: 700; font-size: var(--text-sm); }
.swatch code { font-family: var(--font-mono); color: var(--color-muted); overflow-wrap: anywhere; }
.type-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--space-4); align-items: baseline; padding-block: var(--space-2); border-top: 1px solid var(--color-rule); }
.type-row:first-child { border-top: 0; }
.space-row { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); }
.space-row i { display: block; height: 10px; background: var(--color-accent); }
.icon-cell { display: grid; justify-items: center; gap: 6px; padding: var(--space-3); border: 1px solid var(--color-rule); background: var(--color-surface); border-radius: var(--radius-1); font-size: var(--text-xs); color: var(--color-muted); }
.icon-cell .ico { width: 22px; height: 22px; color: var(--color-fg); }
.screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-3); }
.screens a { display: grid; gap: 2px; padding: var(--space-3) var(--space-4); background: var(--color-surface); border: 1px solid var(--color-line); border-top: 4px solid var(--color-accent); color: var(--color-fg); text-decoration: none; }
.screens a:hover { border-color: var(--color-muted); }
.screens b { font-family: var(--font-display); font-weight: 900; }
.screens span { font-size: var(--text-xs); color: var(--color-muted); }
.cat-panel { position: static; width: 100%; max-width: 400px; height: 560px; border: 1px solid var(--color-line); }
.cat-drawer { position: static; width: 100%; max-width: 620px; box-shadow: var(--shadow-sheet); border: 1px solid var(--color-line); border-left: var(--rule-double); padding: var(--space-5); overflow: visible; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-4); align-items: start; }
@media (max-width: 860px) {
  .cat { grid-template-columns: minmax(0, 1fr); padding-left: max(var(--space-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-4), env(safe-area-inset-right, 0px)); }
  .cat-toc { position: static; display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .type-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}
</style>
</head>
<body>
<div class="cat">
  <nav class="cat-toc" aria-label="目次" id="toc"></nav>
  <main class="cat-main" id="main"></main>
</div>
<div class="scrim" id="scrim" data-close-drawer hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="dialog" id="dialog" hidden></div>
<div class="celebrate" id="celebrate" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
const { D, t, icon, avatar, avatarOf, emblem, pts, dueChip, tier, book, sprintNotice, raidNotice, levelPanel, load, capacityRows,
  board, treeEpic, treeStory, progress, pageHead } = SQ;

const COLORS = [
  ["地と線", [["地", "--color-bg", "画面の地"], ["面", "--color-surface", "台帳、面、入力欄"], ["一段下", "--color-sunken", "メニュー、列、タグ"], ["枠", "--color-line", "枠の線"], ["罫", "--color-rule", "行を分ける線"]]],
  ["文字", [["文字", "--color-fg", "本文"], ["弱", "--color-muted", "補足、ラベル"], ["淡", "--color-faint", "押す前の操作、未入力"]]],
  ["役割", [["操作", "--color-accent", "操作、選択、進み"], ["操作の淡", "--color-accent-soft", "選択の地"], ["完了", "--color-done", "完了の印、クリア"], ["印", "--color-stamp", "依頼主の印、通知の数"], ["経験値", "--color-xp", "経験値とレベル、レイドだけ"], ["経験値の淡", "--color-xp-soft", "今日やるの地"]]],
  ["状態", [["危", "--color-danger", "期限切れ、重量オーバー"], ["注", "--color-warn", "今週が期限、未記入"], ["良", "--color-ok", "取り込み元で完了、余力あり"]]],
  ["クリア報酬の段階", [["小", "--color-tier-small", ""], ["中", "--color-tier-medium", ""], ["大", "--color-tier-large", ""]]],
];
const SCREENS = [
  ["login.html", "ログイン", "ログイン、ログインできないとき、届いた招待"],
  ["organizations.html", "組織の選択", "入れる組織が2つ以上の人のログイン直後"],
  ["today.html", "自分の今日", "全ワークスペースの自分のタスク、レベル、積載量"],
  ["notifications.html", "通知", "画面の中の知らせ、既読"],
  ["me.html", "自分の設定", "1日の基準、休み、経験値の明細、招待"],
  ["admin.html", "組織の管理", "ユーザー、ワークスペース、組織の休日"],
  ["operator.html", "運用", "組織の一覧、作成、停止、管理者の指名し直し（運用者）"],
  ["inbox.html", () => t("inbox"), "取り込んだものの仕分け"],
  ["backlog.html", () => t("backlog"), "エピック、ストーリー、タスクの木"],
  ["sprint.html", () => t("sprint"), "列とカード、ゴール、延長と終了"],
  ["plan.html", () => t("plan"), "ベロシティ、先のスプリント、積載量"],
  ["epic.html", () => t("epic"), "依頼書、討伐隊、達成目標"],
  ["capacity.html", () => t("capacity"), "メンバー × 月、スプリント"],
  ["records.html", "完了の記録", "区分と計上月、記録の修正"],
  ["archive.html", () => t("archive"), "扱わない取り込んだタスク"],
  ["connections.html", () => t("connection"), "取り込み元の状態と登録"],
  ["members.html", "メンバー", "ロール、配分、招待"],
  ["settings.html", "設定", "列、決まった欄、完成の定義、区分ほか"],
  ["history.html", "変更の履歴", "権限、配分、接続などの変更"],
  ["today.html?first=member", "最初の日・一般", "招待を承諾した直後。最初にやることと空の状態"],
  ["today.html?first=leader", "最初の日・リーダー", "ワークスペースを任された直後"],
  ["today.html?first=admin", "最初の日・管理者", "組織を作ってもらった直後。ワークスペースがまだない"],
];
const SAMPLE = ["t1", "t8", "t11", "t12", "t9", "t14"].map(SQ.task);

function block(id, title, intro, demo, rules, names) {
  return `<section class="cat-block" id="${id}">
    <h2 class="section-title">${title}</h2>
    ${intro ? `<p>${intro}</p>` : ""}
    <div class="cat-demo">${demo}</div>
    ${names ? `<span class="cat-name">${names}</span>` : ""}
    ${rules ? `<ul class="cat-rules">${rules.map((r) => `<li>${r}</li>`).join("")}</ul>` : ""}
  </section>`;
}
function colorBlock() {
  const cs = getComputedStyle(document.documentElement);
  return COLORS.map(([group, list]) => `<div class="field"><span class="field-label">${group}</span><div class="cat-grid">${list.map(([n, v, use]) =>
    `<div class="swatch"><i style="background:var(${v})"></i><b>${n}</b><code>${v}</code><code>${cs.getPropertyValue(v).trim()}</code>${use ? `<span>${use}</span>` : ""}</div>`).join("")}</div></div>`).join("");
}
function drawerDemo() {
  const st = SQ.drawerState;
  const keep = st.id; st.id = "t1";
  const html = SQ.drawerHtml().replace('id="drawer-title"', 'id="demo-drawer-title"').replace(/data-close-drawer|data-drawer-size/g, "disabled");
  st.id = keep;
  return `<div class="drawer cat-drawer">${html}</div>`;
}

// アシスタントの見本。押しても会話が進まないよう data-assist-* を外す（答えに出たタスクは押すと詳細が開く）。本物は上のボタンで開く
function assistDemo() {
  const strip = (h) => h.replace(/\sdata-assist-[a-z-]+(="[^"]*")?/g, "");
  const ai = (o) => ({ role: "ai", steps: [], text: "", ...o, step: o.step ?? (o.steps || []).length, shown: o.shown ?? (o.text || "").length });
  const msg = (m) => strip(SQ.assistMsg(m));
  const user = (text) => SQ.assistMsg({ role: "user", text });
  const steps = [`${SQ.sprintLabel("sp14")}の${t("task")}を読んでいます`, `${t("due")}と${t("column")}を確かめています`];
  const rows = ["t4", "t5", "t9", "t13", "t3", "t8", "t1"].map((id, j) => {
    const x = SQ.task(id);
    return { id, field: t("assignee"), from: x.who ? SQ.user(x.who).name : "担当なし", to: "リン", on: j !== 2 };
  });
  const confirm = (state, more) => ({ state, more, note: `${t("assignee")}を変えても、${t("points")}と${t("column")}はそのままです。`, rows });
  const sp = D.sprints.sp14;
  const late = ai({ steps, text: `残り ${sp.days - sp.dayIndex} 日で、気になるのは 2 件です。${t("due")}を過ぎたものと、${t("points")}が大きいのにまだ手を付けていないものを挙げました。`,
    refs: [["t8", `<span class="chip is-danger">${icon("alert")}${t("due")}切れ 10/17</span>`], ["t3", `<span class="chip is-warn">${icon("clock")}5 pt で出発前</span>`]] });
  return `
    <div class="field"><span class="field-label">開く所とパレット</span>
      <div class="cat-row"><button class="pill assist-launch" type="button" data-assist-open>${icon("spark")}<span>${t("assistant")}に頼む</span><kbd class="kbd">${SQ.ASSIST_KEY}</kbd></button><span class="field-hint">押すと本物のパレットが開く。例の頼みごとを押して試せる</span></div>
      <div class="assist-sheet">
        <div class="assist-ask">${icon("spark")}<input class="assist-input" placeholder="${t("assistant")}に頼む" aria-label="見本の入力" tabindex="-1"><span class="icon-btn" aria-hidden="true">${icon("send")}</span></div>
        <div class="assist-context"><span class="assist-ctx">${icon("board")}<span>${SQ.sprintLabel("sp14")}を見ています</span><button type="button" aria-label="開いている画面を前提から外す" tabindex="-1">${icon("x")}</button></span></div>
        <div class="assist-body">${strip(SQ.assistSuggest())}</div>
        <div class="assist-foot"><span>送る先: ${SQ.PROVIDER.claude}・会話は保存しません</span><span><kbd class="kbd">Esc</kbd> 閉じる</span></div></div></div>
    <div class="two">
      <div class="field"><span class="field-label">道具を呼んでいる途中と、流れてくる答え</span><div class="assist-body">${user(`今の${t("sprint")}で遅れそうな${t("task")}は`)}${msg(ai({ steps, step: 1 }))}${msg(ai({ steps, text: late.text, shown: 18 }))}</div></div>
      <div class="field"><span class="field-label">読むだけの答え（すぐ出す）</span><div class="assist-body">${msg(late)}</div></div>
    </div>
    <div class="two">
      <div class="field"><span class="field-label">変える前の確認（5 件を超えると畳む）</span><div class="assist-body">${msg(ai({ text: `${rows.length} 件の${t("assignee")}をリンにします。`, confirm: confirm("ask", false) }))}</div></div>
      <div class="field"><span class="field-label">実行した後と、やめたとき</span><div class="assist-body">${msg(ai({ text: `${rows.length} 件の${t("assignee")}をリンにします。`, confirm: confirm("done") }))}${msg(ai({ text: `${rows.length} 件の${t("assignee")}をリンにします。`, confirm: confirm("cancel") }))}</div></div>
    </div>
    <div class="two">
      <div class="field"><span class="field-label">権限が足りない、失敗した</span><div class="assist-body">${msg(ai({ steps: ["できる操作を確かめています"], text: "この操作はできません。", deny: `人数の上限を変えられるのは運用者だけで、あなたの権限ではできません。上げたいときは、${t("admin")}から運用者に相談してください。` }))}${msg(ai({ error: "応答を受け取れませんでした。何も変えていません。少し待ってから、もう一度頼んでください。" }))}</div></div>
      <div class="field"><span class="field-label">使えないとき（${t("organization")}で無効、今月の上限）</span>${strip(SQ.assistBlocked("off"))}${strip(SQ.assistBlocked("limit"))}</div>
    </div>
    <div class="two">
      <div class="field"><span class="field-label">横の欄（パレットの「横の欄で続ける」で移る）</span>
        <aside class="assist-panel cat-panel" aria-label="横の欄の見本"><div class="assist-panel-head">${icon("spark")}<h3 class="assist-panel-title">${t("assistant")}</h3><span class="link-btn">会話を消す</span><span class="pill" aria-hidden="true">${icon("x")}</span></div>
          <div class="assist-context"><span class="assist-ctx">${icon("board")}<span>${SQ.sprintLabel("sp14")}を見ています</span></span></div>
          <div class="assist-thread">${user(`今の${t("sprint")}で遅れそうな${t("task")}は`)}${msg(late)}</div>
          <div class="assist-ask">${icon("spark")}<input class="assist-input" placeholder="${t("assistant")}に頼む" aria-label="見本の入力" tabindex="-1"><span class="icon-btn" aria-hidden="true">${icon("send")}</span></div>
          <p class="assist-foot">送る先: ${SQ.PROVIDER.claude}・会話は保存しません。画面を閉じると消えます</p></aside></div>
      <div class="field"><span class="field-label">今月の利用量（${t("organization")}の管理）</span>${SQ.meter(1.3, 5, { unit: "百万トークン", note: "上限は運用者が決める。" })}${SQ.meter(4.2, 5, { unit: "百万トークン", note: "80% を超えたら警告。" })}${SQ.meter(5, 5, { unit: "百万トークン", note: "上限で止まる。" })}</div>
    </div>`;
}

const SECTIONS = [
  ["screens", "画面の見本", () => block("screens", "画面の見本", "部品だけで組んだ画面。メニューから行き来でき、タスクを押すと詳細が開く。各画面の上の帯の「見本」で、使い込んだ状態と最初の日（一般、リーダー、管理者）を切り替えられる。",
    `<div class="screens">${SCREENS.map(([href, name, note]) => `<a href="${href}"><b>${typeof name === "function" ? name() : name}</b><span>${note}</span></a>`).join("")}</div>`)],
  ["colors", "色", () => block("colors", "色", "色は役割で名前を付ける。部品は tokens.css の変数だけを使い、素の値を書かない。テーマを切り替えると、同じ名前のまま値が入れ替わる。",
    colorBlock(), ["完了の色は完了の印とクリアだけ、経験値の色は経験値とレベルとレイドだけに使い、他の意味を持たせない。", "状態の色は、必ずアイコンか文字と一緒に使う（色だけで区別しない）。", "操作の色は操作と選択と進みの色。飾りには使わない。"])],
  ["type", "文字", () => block("type", "文字", "書体は役割で4つに分ける。",
    `<div>
      <div class="type-row"><span class="cat-name">--font-display<br>2xl / --weight-display</span><span class="page-title">自分の今日</span></div>
      <div class="type-row"><span class="cat-name">--font-display<br>xl / --weight-display</span><span class="section-title">今週が${t("due")}</span></div>
      <div class="type-row"><span class="cat-name">--font-display<br>lg / 700</span><span class="notice-title">勤怠の月次の締めを手作業なしで回す</span></div>
      <div class="type-row"><span class="cat-name">--font-body<br>md / 400</span><span>購入額に応じてポイントを付け、次の購入で使えるようにする。年内の公開が先方との約束。</span></div>
      <div class="type-row"><span class="cat-name">--font-body<br>xs</span><span style="font-size:var(--text-xs);color:var(--color-muted)">補足とラベルの大きさ。12px より小さくしない。</span></div>
      <div class="type-row"><span class="cat-name">--font-mono</span><span class="mono">SHOP-128 · acme/shop#412 · 2026-10-13 〜 10/26 · 5 pt</span></div>
      <div class="type-row"><span class="cat-name">.wrap-anywhere</span><span class="mono wrap-anywhere">9f2c4e7a1b3d5f60718293a4b5c6d7e8f901a2b3</span></div>
      <div class="type-row"><span class="cat-name">--font-stat</span><span class="xp-num">1,240<small>XP</small></span></div>
    </div>`,
    ["見出しの書体（--font-display）は画面と節の見出し、貼り紙と引き出しの題、列の名前だけ。本文やボタンには使わない。シンプルはゴシック、中世風は明朝、現代風は Chakra Petch とゴシック。", "キー、日付、ポイントは mono、レベルと経験値と積載量の数字は stat。数字が縦に並ぶ所は等幅の数字にする。", "版（40文字のコミットの SHA）、ID、URL のように、区切りがなく長くなる文字列には wrap-anywhere を足す。狭い幅でも、横にはみ出さずに途中で折る。表のセルなど折らない所では付けない。"])],
  ["space", "余白と形", () => block("space", "余白と形", "余白は 4px 刻み。角、区切りの線、影はテーマで変わる。",
    `<div class="two"><div class="field">${[1, 2, 3, 4, 5, 6, 8, 10].map((n) => `<div class="space-row"><span class="cat-name" style="width:80px">--space-${n}</span><i style="width:var(--space-${n})"></i></div>`).join("")}</div>
     <div class="field">
       <div class="cat-row"><span class="cat-name" style="width:110px">--radius-1</span><span style="width:60px;height:36px;border:1px solid var(--color-line);border-radius:var(--radius-1);background:var(--color-surface)"></span></div>
       <div class="cat-row"><span class="cat-name" style="width:110px">--rule-double</span><span style="width:120px;height:0;border-top:var(--rule-double)"></span></div>
       <div class="cat-row"><span class="cat-name" style="width:110px">--shadow-sheet</span><span style="width:120px;height:44px;background:var(--color-surface);border:1px solid var(--color-line);box-shadow:var(--shadow-sheet)"></span></div>
     </div></div>`,
    ["影は「貼り紙」（--shadow-sheet）、ゲームの面の光（--shadow-panel、現代風だけ）、上に浮く物（--shadow-float、引き出しなど）の3つだけ。", "区切りの線（--rule-double）は、画面の見出しの下、メニューの境、台帳と木の左端、列の見出しの下に使う。中世風では二重罫になる。"])],
  ["logo", "ロゴ", () => block("logo", "ロゴ", "金色の旗と生成りのチェックのマークに、名前を横に組む。マークは favicon（static/favicon.svg）と同じ形と色。",

        <span class="page-eyebrow">Scrum Guild</span>
        <h1 class="page-title">デザインシステム</h1>
        <p class="cat-lead">テーマは5つ（シンプル（自動、ライト、ダーク）、中世風、現代風）。すぐ下で切り替えられる。部品はどのテーマでも同じで、変わるのは tokens.css の変数とテーマの飾りだけ。画面は、ここにある部品だけで組む。足りない部品は先にここへ足す。読み込む順は tokens.css、components.css、icons.js、sample-data.js、kit.js。</p>
      </div>
      <div class="cat-row">
        <button class="pill" type="button" data-switch="vocab">${icon("swap")}<span data-vocab-label></span></button>
      </div>
      <div class="segmented" role="radiogroup" aria-label="テーマ">${SQ.THEMES.map((v) => `<label><input type="radio" name="cat-theme" value="${v}" data-pick-theme><span>${SQ.THEME_LABEL[v]}</span></label>`).join("")}</div>
    </header>
    ${SECTIONS.map(([, , fn]) => fn()).join("")}`;
  document.querySelectorAll("[data-switch='vocab']").forEach((b) => (b.onclick = SQ.toggleVocab));
  document.querySelectorAll("[data-vocab-label]").forEach((el) => (el.textContent = `言葉: ${t("vocab")}`));
  SQ.applyTheme();
}
SQ.enableAssistOnCatalog();
SQ.onChange(render);
SQ.onRedraw(render);
new MutationObserver(() => { const el = document.querySelector("#colors .cat-demo"); if (el) el.innerHTML = colorBlock(); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
</script>
</body>
