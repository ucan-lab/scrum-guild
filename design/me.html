<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild マイプロフィール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// マイプロフィール: 届いた招待（この組織のワークスペースへの招待。本文の先頭に囲みの知らせで）、稼働の基準、休み、テーマ、API トークン、全ワークスペースの積載量、経験値の明細。
// アカウントのボタンに招待の点、メニューの「マイプロフィール」に届いた招待の件数を付ける
const { D, t, icon, esc, pageHead, load, levelPanel } = SQ;
const M = D.mine;
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
function setting(title, desc, body) {
  return `<section class="setting"><div class="setting-head"><h2 class="setting-title">${title}</h2><p class="setting-desc">${desc}</p></div><div class="setting-body">${body}</div></section>`;
}

SQ.mount("me", () => `
  ${pageHead("ミナト", "マイプロフィール", [], `<button class="btn is-primary" type="button" data-toast="保存しました">保存する</button>`)}
  ${D.receivedInvites.map((i) => `<div class="callout is-info">${icon("mail")}<span>${esc(i.organization)}の${esc(i.by)}さんから「${esc(i.ws)}」への招待が届いています（${i.role === "member" ? "一般" : t("leader")}、${esc(i.at)}）。</span>
    <div class="callout-actions"><button class="btn is-sm is-primary" type="button" aria-label="${esc(i.ws)}への招待を承諾する" data-toast="「${esc(i.ws)}」に参加しました">承諾する</button><button class="btn is-sm is-quiet" type="button" aria-label="${esc(i.ws)}への招待を辞退する" data-toast="辞退しました">辞退する</button></div></div>`).join("")}
  ${M.allocTotals.filter(([, v]) => v > 100).map(([m, v]) => `<div class="callout is-warn">${icon("alert")}<span>${+m.slice(5)}月は、所属する${t("workspace")}の配分の合計が ${v}% です。各${t("leader")}に相談してください。この知らせは本人にだけ見えています。</span></div>`).join("")}
  <div class="layout-aside">
    <div class="layout-main">
      <div class="settings">
        ${setting("1日の基準", `${t("capacity")}の基準になる、1日に働く時間と許容幅、稼働する曜日。適用を始める月を付けて変えるので、過去の月の値は動きません。`, `
          <div class="form-row">
            <label class="field" for="hours"><span class="field-label">1日の時間</span><input class="input" id="hours" type="number" value="8" step="0.5" min="0" max="24"></label>
            <label class="field" for="tol"><span class="field-label">許容幅（±%）</span><input class="input" id="tol" type="number" value="12.5" step="0.5" min="0" max="100"></label>
            <label class="field" for="from"><span class="field-label">適用を始める月</span><input class="input" id="from" value="2026-11"></label>
          </div>
          <div class="field"><span class="field-label">稼働する曜日</span><div class="weekdays">${WEEK.map((w, i) => `<label><input type="checkbox" ${M.weekdays.includes(i) ? "checked" : ""} aria-label="${w}曜日"><span>${w}</span></label>`).join("")}</div></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>適用を始めた月</th><th class="is-num">1日</th><th class="is-num">許容幅</th><th>曜日</th></tr></thead>
            <tbody>${M.capacityHistory.map(([m, h, tl, wd]) => `<tr><td class="mono">${m}</td><td class="is-num">${h} 時間</td><td class="is-num">±${tl}%</td><td>${wd}</td></tr>`).join("")}</tbody></table></div>`)}
        ${setting("稼働期間", `入った日と抜ける日。期間の外の日は基準に数えません。空なら区切りません。本人と管理者が変えられます。`, `
          <div class="form-row">
            <label class="field" for="ws"><span class="field-label">稼働開始日</span><input class="input" id="ws" type="date" value="${M.workStart}"></label>
            <label class="field" for="we"><span class="field-label">稼働終了日</span><input class="input" id="we" type="date"></label>
          </div>`)}
        ${setting("休み", `所属するすべての${t("workspace")}に効きます。半日は稼働日 0.5 日と数えます。理由は書きません。`, `
          <ul class="party-list">${M.timeOff.map(([d, k]) => `<li><span class="mono">${d}</span><span class="tag">${k}</span><button class="icon-btn is-danger" type="button" aria-label="${d} の休みを消す" style="margin-left:auto">${icon("trash")}</button></li>`).join("")}</ul>
          <div class="form-row"><label class="field" for="off"><span class="field-label">日付</span><input class="input" id="off" type="date"></label>
            <div class="field"><span class="field-label">長さ</span><div class="segmented" role="radiogroup"><label><input type="radio" name="k" checked><span>終日</span></label><label><input type="radio" name="k"><span>半日</span></label></div></div>
            <button class="btn" type="button" data-toast="休みを足しました">足す</button></div>`)}
        ${setting("月の基準の上書き", `按分では合わない月だけ、その月の基準を時間で決めます。`, `
          <ul class="party-list">${M.overrides.map(([m, h]) => `<li><span class="mono">${m}</span><span>${h} 時間</span><button class="icon-btn is-danger" type="button" aria-label="${m} の上書きを消す" style="margin-left:auto">${icon("trash")}</button></li>`).join("")}</ul>
          <div class="form-row"><label class="field" for="om"><span class="field-label">月</span><input class="input" id="om" placeholder="2027-01"></label><label class="field" for="oh"><span class="field-label">時間</span><input class="input" id="oh" type="number"></label><button class="btn" type="button">足す</button></div>`)}
        ${setting("テーマ", `画面の見た目。選ぶとすぐに変わります。自分で選ばなければ、管理者が決めた組織の既定に従います。`, `
          <div class="choice-list">
            <label class="choice"><input type="radio" name="my-theme" value="" data-pick-theme><div><b>組織の既定に従う</b><span>今はシンプル（自動）</span></div></label>
            ${SQ.THEMES.map((v) => `<label class="choice"><input type="radio" name="my-theme" value="${v}" data-pick-theme><div><b>${SQ.THEME_LABEL[v]}</b><span>${SQ.THEME_NOTE[v]}</span></div></label>`).join("")}
          </div>`)}
      </div>
    </div>
    <aside class="layout-side">
      ${levelPanel()}
      <section class="panel"><div class="panel-title"><b>${t("capacity")}の合計</b>10月・すべての${t("workspace")}</div>
        ${load(D.workspaces.wa.name, "配分 60%", 103.2, 118.0)}
        ${load(D.workspaces.wb.name, "配分 40%", 68.8, 50.0)}
        ${load("合計", "ユーザーの基準", 172.0, 168.0)}
      </section>
    </aside>
  </div>
  <!-- API トークンの節も5列の表を持つので、経験値の明細と同じ理由で、.setting（見出しの列 260px）にも、横の面と並ぶ本文
       （.layout-main）にも入れず、.layout-aside の下に Section で全幅に置く（説明を見出しの下に置き、表を押しつぶさない） -->
  ${SQ.section("me-tokens", "API トークン", null, `
    <p class="action-note">CLI や MCP に渡す鍵。発行した人と同じ権限の範囲で、画面を通さずに API を呼べます。</p>
      <form class="form" aria-label="API トークンの発行" onsubmit="return false">
        <div class="form-row is-start">
          <div class="field"><label class="field-label" for="tk-name">名前</label><input class="input" id="tk-name" autocomplete="off" aria-describedby="tk-name-hint"><span class="field-hint" id="tk-name-hint">何に使う鍵か分かる名前（100文字まで）</span></div>
          <div class="field"><span class="field-label" id="tk-scope-label">範囲</span>
            <div class="segmented" role="radiogroup" aria-labelledby="tk-scope-label" aria-describedby="tk-scope-hint"><label><input type="radio" name="tk-scope" checked><span>読み取り</span></label><label><input type="radio" name="tk-scope"><span>書き込み</span></label></div>
            <span class="field-hint" id="tk-scope-hint">読み取りは見るだけ。書き込みは、あなたの権限で変えることもできます。</span></div>
          <div class="field"><label class="field-label" for="tk-days">有効日数</label><input class="input" id="tk-days" type="number" inputmode="numeric" min="1" max="90" step="1" value="90" aria-describedby="tk-days-hint"><span class="field-hint" id="tk-days-hint">1〜90日。期限が来ると使えなくなります</span></div>
        </div>
        <div class="form-actions"><button class="btn is-primary" type="button" data-dialog="tokenIssued">発行する</button></div>
      </form>
      <!-- 通常の発行の欄と、発行できないときにその欄へ出す案内を並べて示す。 -->
      <h3 class="field-label">発行できないとき</h3>
      <div class="callout is-info">${icon("lock")}<span id="tk-reauth-hint">API トークンを発行するには、ログインし直してください。発行はログインから10分以内に限られます。</span>
        <div class="callout-actions"><a class="btn is-primary" href="login.html?return_to=%2Faoba%2Fme" aria-describedby="tk-reauth-hint">ログインし直す</a></div>
      </div>
      <div class="table-wrap"><table class="table is-stacked" aria-label="発行済みの API トークン"><thead><tr><th class="is-name">名前</th><th>範囲</th><th>期限</th><th>最後に使った日</th><th class="is-actions"><span class="visually-hidden">操作</span></th></tr></thead>
        <tbody>
          <tr><td class="is-name wrap-anywhere" data-label="名前">手元の CLI</td><td data-label="範囲"><span class="tag">書き込み</span></td><td class="mono" data-label="期限">2026-12-29</td><td class="mono" data-label="最後に使った日">2026-10-30</td><td class="is-actions"><button class="btn is-sm is-quiet is-danger" type="button" data-dialog="tokenRevoke" aria-label="API トークン「手元の CLI」を取り消す">取り消す</button></td></tr>
          <tr><td class="is-name wrap-anywhere" data-label="名前">MCP（読み取りだけ）</td><td data-label="範囲"><span class="tag">読み取り</span></td><td class="mono" data-label="期限">2026-11-15</td><td data-label="最後に使った日">未使用</td><td class="is-actions"><button class="btn is-sm is-quiet is-danger" type="button" data-dialog="tokenRevoke" aria-label="API トークン「MCP（読み取りだけ）」を取り消す">取り消す</button></td></tr>
        </tbody></table></div>`)}
  <!-- 経験値の明細は5列の表なので、.setting（見出しの列 260px）にも、横の面と並ぶ本文にも入れず、説明を表の上に置いて
       画面の幅いっぱいに出す（上の API トークンの節も同じ）。760px 以下は is-stacked で行を縦に積む。今所属していないワークスペースの行は内容を伏せる（最後の行） -->
  ${SQ.section("me-experience", "経験値の明細", null, `
    <p class="action-note">本人だけが見られます。打ち消しは負の値で残ります。手で足し引きする操作はありません。</p>
    <div class="table-wrap"><table class="table is-stacked" aria-label="経験値の明細"><thead><tr><th>確定日時</th><th>${t("workspace")}</th><th>行動</th><th class="is-name">内容</th><th class="is-num">${icon("crystal", "xp")} XP</th></tr></thead>
      <tbody>${M.xp.map(([at, a, w, v, ws]) => `<tr><td class="mono" data-label="確定日時">${at}</td><td class="wrap-anywhere" data-label="${t("workspace")}">${esc(ws)}</td><td data-label="行動"><span class="tag">${a}</span></td><td class="is-name wrap-anywhere" data-label="内容">${w === null ? `<span class="props-note">（今所属していない${t("workspace")}の内容は表示しません）</span>` : esc(w)}</td><td class="is-num" data-label="XP">${SQ.xpDelta(v)}</td></tr>`).join("")}</tbody></table></div>
    <div class="form-actions"><button class="btn is-sm" type="button" data-toast="見本のため、続きはありません">続きを読む</button></div>`)}`);
</script>
</body>
</html>
