<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild バックログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// バックログ: エピック、ストーリー、タスクの木。並びが優先順位
const { D, t, icon, pageHead, treeEpic, treeStory, entry } = SQ;

// 絞り込みの帯。選択欄は1つだけ選ぶ select で、先頭が「すべて」、末尾が「なし」。担当は先頭に「自分」を置き、
// 今所属している人の後に、離脱した人のうち未完了のタスクの担当に残っている人を「（離脱済み）」を添えて並べる。
// 接続と取り込み元のプロジェクトやリポジトリの選択欄は、取り込み（#67）で同じ形に足す。
// 見本は絞り込まず、値を選ぶと「絞り込みを外す」と、並べ替えを止める案内に替わるところだけを見せる
function filterBar(open) {
  const all = (label) => opt("", t("filterAll").replace("{label}", label));
  const opt = (value, label) => `<option value="${SQ.esc(value)}">${SQ.esc(label)}</option>`;
  const current = D.members.filter((m) => !m.left).map((m) => m.who);
  const leftWithTasks = [...new Set(open.map((x) => x.who).filter((who) => who && !current.includes(who)))];
  return `<div class="toolbar" role="search" aria-label="${SQ.esc(t("filterLabel").replace("{backlog}", t("backlog")))}" id="backlog-filter">
      <label class="search" for="q">${icon("search")}<input id="q" type="search" placeholder="${t("backlogSearch")}" aria-label="${t("backlogSearch")}"></label>
      <select class="select" id="f-who" aria-label="${t("assignee")}">${all(t("assignee"))}${opt("me", t("filterMe"))}${current.map((who) => opt(who, D.users[who].name)).join("")}${leftWithTasks.map((who) => opt(who, `${D.users[who].name}${t("leftMember")}`)).join("")}${opt("none", t("unassigned"))}</select>
      <select class="select" id="f-cat" aria-label="${t("category")}">${all(t("category"))}${Object.entries(D.categories).map(([id, c]) => opt(id, c.name)).join("")}${opt("none", t("categoryNone").replace("{category}", t("category")))}</select>
      <select class="select" id="f-repo" aria-label="リポジトリ">${all("リポジトリ")}${Object.entries(D.repositories).map(([id, r]) => opt(id, r.name)).join("")}${opt("none", t("filterNoRepository"))}</select>
      <select class="select" id="f-epic" aria-label="${t("epic")}">${all(t("epic"))}${Object.entries(D.epics).map(([id, e]) => opt(id, e.title)).join("")}${opt("none", t("filterNoEpic").replace("{epic}", t("epic")))}</select>
      <span class="toolbar-end" id="f-clear" hidden><button class="btn is-sm is-quiet" type="button">${icon("x")}${t("filterClear")}</button></span>
    </div>`;
}

// 値を選ぶか探すと、帯の端に「絞り込みを外す」を出し、並べ替えの案内を替えて、行の「上へ」「下へ」とつまみを隠す（親を移すは残す）
document.addEventListener("input", (ev) => {
  const bar = ev.target.closest && ev.target.closest("#backlog-filter");
  if (!bar) return;
  const filtering = [...bar.querySelectorAll("select")].some((s) => s.value !== "") || bar.querySelector("#q").value.trim() !== "";
  bar.querySelector("#f-clear").hidden = !filtering;
  document.getElementById("order-note").innerHTML = filtering ? SQ.esc(t("backlogFilterOrderNote"))
    : `上にあるものほど優先します。${t("epic")}、${t("story")}、${t("task")}は、行の「上へ」「下へ」か、行の中にフォーカスを置いて Alt と ↑ ↓ で並べ替えます。<span class="drag-note">行の先頭のつまみをドラッグしても並べ替えられます。</span>`;
  document.getElementById("totals-note").hidden = !filtering;
  // 「上へ」「下へ」を隠す（エピックの行は「親を移す」を持たないので、どちらも隠れる）
  document.querySelectorAll('.order-actions .icon-btn:not([data-order="swap"])').forEach((b) => (b.hidden = filtering));
  // 中身が全部隠れた .order-actions は、本番と同じく枠ごと隠す（.tree-end の gap を余計に空けない）
  document.querySelectorAll(".order-actions").forEach((s) => (s.hidden = filtering && [...s.children].every((b) => b.hidden)));
  // つまみも隠す（ドラッグも隣を使う並べ替えなので、絞っている間は止める）
  document.querySelectorAll(".grip").forEach((g) => {
    g.hidden = filtering;
    // つまみの列も空けない（本番は行の has-grip を外す）
    g.parentElement.classList.toggle("has-grip", !filtering);
  });
});
document.addEventListener("click", (ev) => {
  if (!ev.target.closest || !ev.target.closest("#f-clear")) return;
  const bar = document.getElementById("backlog-filter");
  bar.querySelectorAll("select").forEach((s) => (s.value = ""));
  bar.querySelector("#q").value = "";
  bar.querySelector("#q").dispatchEvent(new Event("input", { bubbles: true }));
  bar.querySelector("#q").focus();
});

SQ.mount("backlog", () => {
  const open = SQ.tasksWhere((x) => x.ws === "wa" && !x.doneAt);
  const rootTasks = SQ.tasksWhere((x) => x.ws === "wa" && !x.story && !x.doneAt);
  const rootDone = SQ.tasksWhere((x) => x.ws === "wa" && !x.story && x.doneAt).length;
  const actions = `<button class="btn" type="button" data-dialog="createEpic">${icon("plus")}${t("epic")}を作る</button>
    <button class="btn" type="button" data-dialog="createStory">${icon("plus")}${t("story")}を作る</button>
    <button class="btn is-primary" type="button" data-dialog="createTask">${icon("plus")}${t("create")}</button>`;
  // 何もないときは、絞り込みの帯も出さずに最初の一歩だけを示す
  if (!SQ.tasksWhere((x) => x.ws === "wa").length && !Object.keys(D.epics).length && !Object.keys(D.stories).length) {
    return `
      ${pageHead(D.workspaces.wa.name, t("backlog"), [], actions)}
      ${SQ.emptyState("board", `まだ${t("task")}がありません`,
        `${t("task")}を優先する順に並べる場所です。上の「${t("create")}」から最初の${t("task")}を作ります。` +
        (D.connections.length ? "" : `取り込み元を使うなら、${t("connection")}を登録すると${t("inbox")}に届き、そこからここへ入れられます。`),
        D.connections.length ? "" : `<a class="btn is-sm" href="${SQ.firstHref("connections.html")}">${t("connection")}を登録する</a>`, undefined, "notice")}`;
  }
  return `
    ${pageHead(D.workspaces.wa.name, t("backlog"), [
      ["", "board", `未完了の${t("task")}`, open.length],
      ["is-warn", "pen", `${t("detail")} 未記入`, open.filter((x) => x.unfilled).length],
      ["is-warn", "", "未見積もり", open.filter((x) => x.pts == null).length],
      ["", "", `${t("sprint")}に入っていない`, open.filter((x) => !x.sprint).length],
    ], actions, SQ.teamXp())}
    ${D.definitionOfDone.length ? `<details class="dod"><summary>${t("dod")}</summary><div class="doc-box"><ul>${D.definitionOfDone.map((d) => `<li>${SQ.esc(d)}</li>`).join("")}</ul></div></details>` : ""}
    <section class="section" aria-label="${t("backlog")}の${t("task")}">
    ${filterBar(open)}
    <p class="action-note" id="order-note">上にあるものほど優先します。${t("epic")}、${t("story")}、${t("task")}は、行の「上へ」「下へ」か、行の中にフォーカスを置いて Alt と ↑ ↓ で並べ替えます。<span class="drag-note">行の先頭のつまみをドラッグしても並べ替えられます。</span></p>
    <p class="action-note" id="totals-note" hidden>${t("filterTotalsNote").replace("{points}", t("points"))}</p>
    <div class="tree">
      ${treeEpic("e1", { order: { first: true } })}
      ${treeEpic("e2", { order: { last: true } })}
      ${treeStory("s4", true, { order: { first: true, last: true, parent: true } })}
      <div>${rootTasks.map((x, i) => entry(x, { showAssignee: true, showSprint: true, order: { first: i === 0, last: i === rootTasks.length - 1, parent: true } })).join("")}
        ${rootDone ? SQ.completedTasks("root", SQ.tasksWhere(x => x.ws === "wa" && !x.story && x.doneAt), { root: true }) : ""}</div>
    </div>
    </section>`;
});
</script>
</body>
</html>
