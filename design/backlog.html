<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild バックログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// バックログ: エピック、ストーリー、タスクの木。並びが優先順位
const { D, t, icon, pageHead, treeEpic, treeStory, entry } = SQ;

SQ.mount("backlog", () => {
  const open = SQ.tasksWhere((x) => x.ws === "wa" && !x.doneAt);
  const rootTasks = SQ.tasksWhere((x) => x.ws === "wa" && !x.story && !x.doneAt);
  const rootDone = SQ.tasksWhere((x) => x.ws === "wa" && !x.story && x.doneAt).length;
  const actions = `<button class="btn" type="button" data-dialog="createEpic">${icon("plus")}${t("epic")}を作る</button>
    <button class="btn" type="button" data-dialog="createStory">${icon("plus")}${t("story")}を作る</button>
    <button class="btn is-primary" type="button" data-dialog="createTask">${icon("plus")}${t("create")}</button>`;
  // 何もないときは、絞り込みの帯も出さずに最初の一歩だけを示す
  if (!SQ.tasksWhere((x) => x.ws === "wa").length && !Object.keys(D.epics).length && !Object.keys(D.stories).length) {
    return `
      ${pageHead(D.workspaces.wa.name, t("backlog"), [], actions)}
      ${SQ.emptyState("board", `まだ${t("task")}がありません`,
        `${t("task")}を優先する順に並べる場所です。上の「${t("create")}」から最初の${t("task")}を作ります。` +
        (D.connections.length ? "" : `取り込み元を使うなら、${t("connection")}を登録すると${t("inbox")}に届き、そこからここへ入れられます。`),
        D.connections.length ? "" : `<a class="btn is-sm" href="${SQ.firstHref("connections.html")}">${t("connection")}を登録する</a>`)}`;
  }
  return `
    ${pageHead(D.workspaces.wa.name, t("backlog"), [
      ["", "board", `未完了の${t("task")}`, open.length],
      ["is-warn", "pen", `${t("detail")} 未記入`, open.filter((x) => x.unfilled).length],
      ["is-warn", "", "未見積もり", open.filter((x) => x.pts == null).length],
      ["", "", `${t("sprint")}に入っていない`, open.filter((x) => !x.sprint).length],
    ], actions, SQ.teamXp())}
    ${D.definitionOfDone.length ? `<details class="dod"><summary>${t("dod")}</summary><div class="doc-box"><ul>${D.definitionOfDone.map((d) => `<li>${SQ.esc(d)}</li>`).join("")}</ul></div></details>` : ""}
    <section class="section" aria-label="${t("backlog")}の${t("task")}">
    <div class="toolbar" role="search">
      <label class="search" for="q">${icon("search")}<input id="q" type="search" placeholder="タイトルや SHOP-128 で探す"></label>
      <select class="select" id="f-who" aria-label="${t("assignee")}"><option>${t("assignee")}: すべて</option><option>ミナト</option><option>担当なし</option></select>
      <select class="select" id="f-cat" aria-label="${t("category")}"><option>${t("category")}: すべて</option><option>追加案件</option><option>保守</option><option>${t("category")}なし</option></select>
      <select class="select" id="f-repo" aria-label="リポジトリ"><option>リポジトリ: すべて</option>${Object.values(D.repositories).map((r) => `<option>${SQ.esc(r.name)}</option>`).join("")}<option>リポジトリなし</option></select>
      <select class="select" id="f-epic" aria-label="${t("epic")}"><option>${t("epic")}: すべて</option><option>会員ポイント制度を公開する</option><option>決済まわりの障害を減らす</option></select>
      <select class="select" id="f-conn" aria-label="${t("connection")}"><option>${t("connection")}: すべて</option><option>ミナトの Backlog</option><option>ミナトの GitHub</option></select>
      <select class="select" id="f-src" aria-label="取り込み元のプロジェクトとリポジトリ"><option>プロジェクト・リポジトリ: すべて</option><option>SHOP（Backlog）</option><option>acme/shop（GitHub）</option></select>
    </div>
    <p class="action-note">上にあるものほど優先します。${t("story")}と${t("task")}は、行の「上へ」「下へ」か、行の中にフォーカスを置いて Alt と ↑ ↓ で並べ替えます。</p>
    <div class="tree">
      ${treeEpic("e1", { order: true })}
      ${treeEpic("e2", { order: true })}
      ${treeStory("s4", true, { order: { first: true, last: true, parent: true } })}
      <div>${rootTasks.map((x, i) => entry(x, { showAssignee: true, order: { first: i === 0, last: i === rootTasks.length - 1, parent: true } })).join("")}
        ${rootDone ? `<p class="tree-folded is-root">親のない完了 ${rootDone} 件を折りたたんでいます</p>` : ""}</div>
    </div>
    </section>`;
});
</script>
</body>
</html>
