<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="gate"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";

// ログインと、ログインできないとき、招待の承諾
const { t, icon, esc } = SQ;
function render() {
  document.getElementById("gate").innerHTML = `<div class="gate"><div class="gate-stack">
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="brand-name">Scrum Guild</span></div>
      <h1 class="gate-title">ログイン</h1>
      <p>いずれかの${t("organization")}に所属しているか、招待されている人がログインできます。招待されたときの手段でログインしてください。</p>
      <button class="btn is-wide" type="button">${icon("git")}GitHub でログイン</button>
      <button class="btn is-wide is-google" type="button">${SQ.googleMark}Google でログイン</button>
      <p class="gate-note">GitHub と Google は本人確認だけに使います。入れる${t("organization")}が2つ以上あれば、ログインのあとに選びます。</p>
      <div class="form-actions"><a class="btn is-sm is-quiet" href="#">アカウントがまだ無い人は会員登録</a></div>
      <div class="form-actions" role="group" aria-label="利用規約とプライバシーポリシー"><a class="btn is-sm is-quiet" href="#">利用規約</a><a class="btn is-sm is-quiet" href="#">プライバシーポリシー</a></div>
    </section>
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="brand-name">Scrum Guild</span></div>
      <h1 class="gate-title">会員登録</h1>
      <p>GitHub か Google のアカウントで、アカウントを作ります。アカウントだけ作った人は無料で、招待されて入る人も無料です。自分の${t("organization")}を作った場合は、30日間お試しで使い始められます。</p>
      <button class="btn is-wide" type="button">${icon("git")}GitHub で会員登録</button>
      <button class="btn is-wide is-google" type="button">${SQ.googleMark}Google で会員登録</button>
      <p class="gate-note">GitHub と Google は本人確認だけに使います。会員登録のあとに、自分の${t("organization")}を作るか、招待を待つかを選べます。</p>
      <div class="form-actions"><a class="btn is-sm is-quiet" href="#">アカウントがある人はログイン</a></div>
      <div class="form-actions" role="group" aria-label="利用規約とプライバシーポリシー"><a class="btn is-sm is-quiet" href="#">利用規約</a><a class="btn is-sm is-quiet" href="#">プライバシーポリシー</a></div>
    </section>
    <p class="gate-note">会員登録の画面（/signup）の見本です。パスワードの欄は無く、GitHub と Google のボタンだけを置きます。登録の往復の失敗は、ログインの画面に戻して出します。</p>
    <section class="gate-sheet">
      <h2 class="dialog-title">Scrum Guild への招待</h2>
      <p>招待されたメールアドレスの Google アカウントでログインしてください。</p>
      <button class="btn is-wide is-google" type="button">${SQ.googleMark}Google でログイン</button>
      <div class="callout is-warn">${icon("alert")}<span>この招待の URL は使えません。期限が切れたか、取り消されたか、招待されたのと別のアカウントでログインしています。招待した人に確かめるか、届いた招待の URL をもう一度開いてください。もう入れる${t("organization")}がある人は、下のボタンからそのままログインできます。</span></div>
      <p class="gate-note">Google の招待の URL から開いたときの見本です。ボタンを押すまでログインを始めず、すでにログインしていても Google のログインを通します。下は使えなかったときの表示です。</p>
      <div class="form-actions" role="group" aria-label="利用規約とプライバシーポリシー"><a class="btn is-sm is-quiet" href="#" target="_blank" rel="noopener noreferrer">利用規約<span class="visually-hidden"> 新しいタブで開きます</span></a><a class="btn is-sm is-quiet" href="#" target="_blank" rel="noopener noreferrer">プライバシーポリシー<span class="visually-hidden"> 新しいタブで開きます</span></a></div>
    </section>
    <section class="gate-sheet">
      <div class="callout is-info">${icon("shield")}<span>${t("loggedOut")}</span></div>
      <p class="gate-note">ログアウトした直後のログインの画面の表示の見本です。見出しの下、ログインのボタンの上に出します。エラーがあるときは、エラーだけを出します。</p>
    </section>
    <section class="gate-sheet">
      <div class="callout is-warn">${icon("alert")}<span>ログインできませんでした。どの${t("organization")}の${t("workspace")}にも所属しておらず、招待も届いていません。招待された手段（GitHub か Google）と、招待されたアカウントでログインしているか確かめてください。招待がまだなら、${t("leader")}に GitHub のユーザー名か Google のメールアドレスで招待してもらってください。アカウントがまだ無い人は、会員登録から始められます。</span></div>
      <p class="gate-note">ログインできないときの表示の見本です。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">届いた招待</h2>
      <p>ひばり工房から届いた招待です。承諾すると、その${t("workspace")}に入れます。</p>
      <div class="choice-list">
        <div class="choice is-static"><div>
          <b>デザイン相談室</b>
          <span>ひばり工房・ユイさんから・一般・2026-10-19</span>
          <div class="form-actions"><button class="btn is-primary is-sm" type="button">承諾する</button><button class="btn is-quiet is-sm" type="button">辞退する</button></div>
        </div></div>
      </div>
      <p class="gate-note">${t("organization")}ごとの招待の画面（/&lt;slug&gt;/invitations）の見本です。組織の選択の画面の届いた招待から開きます。入れる${t("organization")}が無く招待だけの人は、その${t("organization")}のどの画面を開いてもこの画面になります。</p>
    </section>
    <p class="gate-note" style="text-align:center"><a href="index.html">デザインシステムのカタログへ戻る</a></p>
  </div></div>
  <div class="gate is-reading" style="min-height:0"><div class="gate-stack">
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="brand-name">Scrum Guild</span></div>
      <h2 class="gate-title">プライバシーポリシー</h2>
      <p>改定日: 2026-10-31</p>
      <div class="doc-box">
        <h2 class="doc-h1">第2条 預からないもの</h2>
        <ul><li>取り込み元の本文は、既定では預かりません。</li><li>GitHub と Google のパスワードは預かりません。</li></ul>
        <h2 class="doc-h1">第6条 消す時期</h2>
        <ul><li>解約した組織のデータは、解約にした日（一時停止の後に解約へ切り替えたときは、切り替えた日）から 30 日後に、運営者がすべて消します。</li></ul>
      </div>
      <div class="form-actions" role="group" aria-label="関連するページ"><a class="btn is-sm" href="#">利用規約</a><button class="btn is-sm is-quiet" type="button">前の画面に戻る</button></div>
    </section>
    <p class="gate-note">利用規約とプライバシーポリシー（/terms、/privacy）の見本です。ログインしていなくても開けます。紙の幅は 720px までで、本文は紙の直下に Markdown で置き、下にもう一方のページへのリンクと、元の画面へ戻る操作を置きます（アプリの中から移ってきたときは「前の画面に戻る」ボタン、直に開いたときは「Scrum Guild を開く」リンク）。改定日は紙の上に本文と同じ大きさで1か所だけ出します。ログインと招待の画面の紙の下にも、両方へのリンクを置きます（招待の画面は、秘密を持つので新しいタブで開きます）。</p>
  </div></div>`;
}
SQ.applyTheme();
render();

</script>
</body>
</html>
