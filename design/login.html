<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="gate"></div>
<script src="icons.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";

// ログインと、ログインできないとき、招待の承諾
const { t, icon, esc } = SQ;
function render() {
  document.getElementById("gate").innerHTML = `<div class="gate"><div class="gate-stack">
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="brand-name">Scrum Guild</span></div>
      <h1 class="gate-title">ログイン</h1>
      <p>いずれかの${t("organization")}に所属しているか、招待されている人がログインできます。招待されたときの手段でログインしてください。</p>
      <button class="btn is-wide" type="button">${icon("git")}GitHub でログイン</button>
      <button class="btn is-wide is-google" type="button">${SQ.googleMark}Google でログイン</button>
      <p class="gate-divider">または</p>
      <form class="form-fields" novalidate>
        <div class="field"><label class="field-label" for="d-login-email">メールアドレス</label><input class="input" id="d-login-email" type="email" autocomplete="email" spellcheck="false"></div>
        <div class="field"><label class="field-label" for="d-login-password">パスワード</label><input class="input" id="d-login-password" type="password" autocomplete="current-password"></div>
        <button class="btn is-primary is-wide" type="submit">メールアドレスでログイン</button>
      </form>
      <p class="gate-note">GitHub と Google は本人確認だけに使います。入れる${t("organization")}が2つ以上あれば、ログインのあとに選びます。</p>
    </section>
    <section class="gate-sheet">
      <form class="form-fields" novalidate>
        <div class="field"><label class="field-label" for="d-login-email-2">メールアドレス</label><input class="input" id="d-login-email-2" type="email" autocomplete="email" spellcheck="false" value="tsumugi@example.test" aria-describedby="d-login-error-2"></div>
        <div class="field"><label class="field-label" for="d-login-password-2">パスワード</label><input class="input" id="d-login-password-2" type="password" autocomplete="current-password" aria-describedby="d-login-error-2"></div>
        <div class="callout is-warn" id="d-login-error-2" role="alert">${icon("alert")}<span>メールアドレスかパスワードが違います。確かめて、もう一度ログインしてください。</span></div>
        <button class="btn is-primary is-wide" type="submit">メールアドレスでログイン</button>
      </form>
      <p class="gate-note">メールアドレスとパスワードで断られたときの見本です。画面を移らずに、押したボタンのすぐ上（フォームの中）へ理由を出して欄に結び、前の理由は送っている間も残します。空の欄は送らずに「メールアドレスとパスワードを入れてください。」を出します。メールアドレスの欄は残してパスワードの欄だけ空にします。違うパスワード、登録の無いメールアドレス、形の合わない入力は、どれも同じ文言にします。送っている間はボタンを押せなくし、文言を「ログインしています」にします。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">Scrum Guild への招待</h2>
      <p>招待されたメールアドレスの Google アカウントでログインしてください。</p>
      <button class="btn is-wide is-google" type="button">${SQ.googleMark}Google でログイン</button>
      <div class="callout is-warn">${icon("alert")}<span>この招待の URL は使えません。期限が切れたか、取り消されたか、招待されたのと別のアカウントでログインしています。招待した人に確かめるか、届いた招待の URL をもう一度開いてください。もう入れる${t("organization")}がある人は、下のボタンからそのままログインできます。</span></div>
      <p class="gate-note">Google の招待の URL から開いたときの見本です。ボタンを押すまでログインを始めず、すでにログインしていても Google のログインを通します。下は使えなかったときの表示です。</p>
    </section>
    <section class="gate-sheet">
      <div class="callout is-info">${icon("shield")}<span>${t("loggedOut")}</span></div>
      <p class="gate-note">ログアウトした直後のログインの画面の表示の見本です。見出しの下、ログインのボタンの上に出します。エラーがあるときは、エラーだけを出します。</p>
    </section>
    <section class="gate-sheet">
      <div class="callout is-warn">${icon("alert")}<span>ログインできませんでした。どの${t("organization")}の${t("workspace")}にも所属しておらず、招待も届いていません。招待された手段（GitHub か Google）と、招待されたアカウントでログインしているか確かめてください。招待がまだなら、${t("leader")}に GitHub のユーザー名か Google のメールアドレスで招待してもらってください。</span></div>
      <p class="gate-note">ログインできないときの表示の見本です。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">届いた招待</h2>
      <p>ひばり工房から届いた招待です。承諾すると、その${t("workspace")}に入れます。</p>
      <div class="choice-list">
        <div class="choice is-static"><div>
          <b>デザイン相談室</b>
          <span>ひばり工房・ユイさんから・一般・2026-10-19</span>
          <div class="form-actions"><button class="btn is-primary is-sm" type="button">承諾する</button><button class="btn is-quiet is-sm" type="button">辞退する</button></div>
        </div></div>
      </div>
      <p class="gate-note">${t("organization")}ごとの招待の画面（/&lt;slug&gt;/invitations）の見本です。組織の選択の画面の届いた招待から開きます。入れる${t("organization")}が無く招待だけの人は、その${t("organization")}のどの画面を開いてもこの画面になります。</p>
    </section>
    <p class="gate-note" style="text-align:center"><a href="index.html">デザインシステムのカタログへ戻る</a></p>
  </div></div>`;
}
SQ.applyTheme();
render();

</script>
</body>
</html>
